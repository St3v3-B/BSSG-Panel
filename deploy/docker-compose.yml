# Panel-stack: panel (Next.js), PostgreSQL, Redis, MariaDB (klantdatabases) en Caddy. De daemon draait niet hier maar
# als systemd-unit op de host (deploy/systemd/panel-daemon.service).
#
# Altijd starten met het env-bestand als --env-file (voor ${...} hieronder):
#   docker compose --env-file /etc/panel/panel.env -f deploy/docker-compose.yml up -d --build
# PANEL_ENV_FILE (alleen voor compose, niet in panel.env) wijst het env_file van het panel
# ergens anders heen; tests gebruiken dat, standaard /etc/panel/panel.env.
#
# Alles krijgt panel.managed=true + panel.instance=main, plus panel.role=infra zodat de
# daemon deze objecten kan onderscheiden van game-servers en site-netwerken.

name: panel

x-labels: &labels
  panel.managed: "true"
  panel.instance: "main"
  panel.role: "infra"

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  panel:
    build:
      context: ..
      dockerfile: deploy/panel.Dockerfile
      labels: *labels
      args:
        PANEL_COMMIT: ${PANEL_COMMIT:-unknown}
        PANEL_COMMIT_DATE: ${PANEL_COMMIT_DATE:-}
        PANEL_COMMIT_MESSAGE: ${PANEL_COMMIT_MESSAGE:-}
    image: panel/web:local
    container_name: panel-web
    restart: unless-stopped
    labels: *labels
    env_file:
      - ${PANEL_ENV_FILE:-/etc/panel/panel.env}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    # Het panel bereikt de lokale daemon via DAEMON_URL (standaard https://$NODE_DOMAIN):
    # die naam wijst hier naar de host, waar Caddy op :443 luistert.
    extra_hosts:
      - "${NODE_DOMAIN:?NODE_DOMAIN ontbreekt in het env-bestand}:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [frontend, backend]
    logging: *logging

  postgres:
    image: postgres:16-alpine
    container_name: panel-postgres
    restart: unless-stopped
    labels: *labels
    environment:
      POSTGRES_USER: panel
      POSTGRES_DB: panel
      # Geldt alleen bij de eerste start (lege volume); DATABASE_URL moet hetzelfde wachtwoord hebben.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set (install.sh generates it)}
      TZ: Europe/Amsterdam
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel -d panel"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: panel-redis
    restart: unless-stopped
    labels: *labels
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]
    logging: *logging

  # MariaDB voor de databases van klanten (niet voor het panel zelf; dat is Postgres).
  # - Geen gepubliceerde poorten; 3306 is alleen bereikbaar op twee interne netwerken:
  #   backend (het panel maakt databases/gebruikers aan als root, host `mariadb`) en
  #   panel-db (de daemon koppelt sites met een database hieraan, host `mariadb`).
  # - Het panel zit niet op panel-db, zodat sites via dat netwerk alleen MariaDB zien.
  # - MARIADB_ROOT_PASSWORD geldt alleen bij de eerste start (lege volume), net als bij Postgres.
  # - Draait als mysql (999) met read-only rootfs; de named volume krijgt bij aanmaak de
  #   eigenaar van /var/lib/mysql uit de image.
  mariadb:
    image: mariadb:11
    container_name: panel-mariadb
    restart: unless-stopped
    labels: *labels
    user: "999:999"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD ontbreekt in het env-bestand (deploy/install.sh opnieuw draaien)}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: Europe/Amsterdam
    command: ["--skip-name-resolve", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mariadb_data:/var/lib/mysql
    read_only: true
    tmpfs:
      - /tmp:uid=999,gid=999
      - /run/mysqld:uid=999,gid=999
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      backend: {}
      db:
        aliases: [mariadb]
    logging: *logging

  # Basisconfig van web-hosting (deploy/caddy/, zie de README daar):
  # - Caddyfile gebruikt {$PANEL_DOMAIN}, {$NODE_DOMAIN}, {$ACME_EMAIL} en importeert
  #   /etc/caddy/global.d/*.caddy (in productie leeg; tests/staging zetten daar opties);
  # - admin-API op de unix-socket /run/panel/caddy-admin.sock (CADDY_ADMIN_URL), niet via
  #   TCP: site-containers op gedeelde netwerken kunnen er zo niet bij;
  # - upstreams panel:3000 en unix//run/panel/daemon.sock;
  # - standaardcommando van de image, zonder --resume (de daemon zet dynamische routes
  #   na een herstart opnieuw);
  # - containernaam = CADDY_CONTAINER (standaard panel-caddy), want de daemon koppelt deze
  #   container aan site-netwerken.
  # Alleen de drie domein/ACME-variabelen gaan mee, niet het hele panel.env (geheimen).
  caddy:
    build: ./caddy
    image: panel-caddy:local
    container_name: panel-caddy
    restart: unless-stopped
    labels: *labels
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?PANEL_DOMAIN ontbreekt in het env-bestand}
      NODE_DOMAIN: ${NODE_DOMAIN:?NODE_DOMAIN ontbreekt in het env-bestand}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL ontbreekt in het env-bestand}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/global.d:/etc/caddy/global.d:ro
      - caddy_data:/data
      - caddy_config:/config
      # Map met daemon.sock en caddy-admin.sock (als map, niet de sockets zelf). De unit houdt /run/panel vast (RuntimeDirectoryPreserve=yes),
      # zodat deze bind mount na een herstart van de daemon niet naar een oude map wijst.
      - type: bind
        source: /run/panel
        target: /run/panel
        bind:
          create_host_path: true
    depends_on:
      - panel
    networks: [frontend]
    logging: *logging

networks:
  # Caddy + panel; het panel heeft hier ook uitgaand internet (Discord).
  frontend:
    name: panel-frontend
    labels: *labels
  # Panel + PostgreSQL + Redis, zonder internet en zonder gepubliceerde poorten.
  backend:
    name: panel-backend
    internal: true
    labels: *labels
  # MariaDB + sites met een database (de daemon koppelt ze, naam = vast). Intern: geen internet,
  # geen gepubliceerde poorten; MariaDB is hier de enige dienst (alleen 3306).
  db:
    name: panel-db
    internal: true
    labels: *labels

volumes:
  postgres_data:
    name: panel-postgres-data
    labels: *labels
  redis_data:
    name: panel-redis-data
    labels: *labels
  caddy_data:
    name: panel-caddy-data
    labels: *labels
  caddy_config:
    name: panel-caddy-config
    labels: *labels
  mariadb_data:
    name: panel-mariadb-data
    labels: *labels

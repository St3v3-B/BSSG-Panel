# Unbound of the mail module (panel-unbound): recursive, with DNSSEC, only for containers on the Docker
# network panel-mail (Rspamd). Not published. Mounted read-only on /etc/unbound/unbound.conf.
server:
  interface: 0.0.0.0
  port: 53
  do-ip4: yes
  do-ip6: no
  do-udp: yes
  do-tcp: yes
  username: "unbound"
  chroot: ""
  directory: "/etc/unbound"
  use-syslog: no
  logfile: ""
  verbosity: 1
  log-servfail: no

  # Only private (Docker) networks; everything else is refused.
  access-control: 0.0.0.0/0 refuse
  access-control: 127.0.0.0/8 allow
  access-control: 10.0.0.0/8 allow
  access-control: 172.16.0.0/12 allow
  access-control: 192.168.0.0/16 allow

  root-hints: "/usr/share/dns/root.hints"
  trust-anchor-file: "/usr/share/dns/root.key"

  hide-identity: yes
  hide-version: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  qname-minimisation: yes
  prefetch: yes
  num-threads: 1
  msg-cache-size: 16m
  rrset-cache-size: 32m

remote-control:
  control-enable: no

# Dovecot 2.3 of the mail module (panel-dovecot). Rendered by the entrypoint to /etc/dovecot/dovecot.conf.
# Users and passwords from the panel database (view mail.v_mailboxes, read-only role mail_reader).
protocols = imap lmtp sieve
listen = *
hostname = __MAIL_HOSTNAME__
log_path = /dev/stderr
info_log_path = /dev/stdout
auth_verbose = yes
auth_verbose_passwords = no

# --- TLS: required for every login, 1.2+ only
ssl = required
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes
# ECDHE only, so no ssl_dh (DH parameters) is needed.
ssl_cipher_list = ECDHE+AESGCM:ECDHE+CHACHA20
# ssl_cert / ssl_key (certificate from Caddy, or a self-signed one): written by the entrypoint / mail-reload.
!include /etc/dovecot/tls.conf
disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_username_format = %Lu

# --- mail storage: /var/vmail/<domain>/<local part>/ (home), Maildir in ~/Maildir, owner vmail (5000)
mail_uid = 5000
mail_gid = 5000
first_valid_uid = 5000
last_valid_uid = 5000
mail_location = maildir:~/Maildir
mail_privileged_group =
mail_plugins = $mail_plugins quota

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
  }
}

# --- users from SQL (passwords in Dovecot format {ARGON2ID}$argon2id$...)
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# --- quota per mailbox (count backend; limit quota_mb from SQL, 0 = unlimited)
plugin {
  quota = count:User quota
  quota_vsizes = yes
  quota_rule2 = Trash:storage=+10%%
  quota_grace = 10%%

  sieve = file:~/sieve;active=~/.dovecot.sieve
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota
  mail_max_userip_connections = 20
}
protocol lmtp {
  mail_plugins = $mail_plugins sieve
  postmaster_address = postmaster@__MAIL_HOSTNAME__
}
lmtp_rcpt_check_quota = yes

# --- listeners. Published by compose: 993 (IMAPS) and 4190 (ManageSieve). 24 (LMTP) and 12345 (SASL for
# Postfix) are only reachable on the internal Docker network panel-mail.
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}
service auth {
  inet_listener auth-postfix {
    port = 12345
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}
service stats {
  unix_listener stats-writer {
    mode = 0666
  }
}

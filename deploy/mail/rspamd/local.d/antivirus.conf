# ClamAV (container clamav) via clamd on 3310. Infected mail is rejected.
clamav {
  type = "clamav";
  servers = "clamav:3310";
  symbol = "CLAM_VIRUS";
  action = "reject";
  message = '${SCANNER}: virus found: "${VIRUS}"';
  scan_mime_parts = true;
  scan_text_mime = false;
  scan_image_mime = false;
  max_size = 20000000;
  timeout = 15.0;
  retransmits = 1;
  log_clean = false;
}

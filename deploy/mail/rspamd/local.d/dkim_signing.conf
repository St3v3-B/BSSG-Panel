# DKIM signing per domain. The daemon writes the keys (PUT /api/mail/dkim/{domain}) into the volume
# mail-dkim: /var/lib/rspamd/dkim/<domain>.<selector>.key, plus one line "<domain> <selector>" per domain in
# selectors.map (a map Rspamd reloads by itself), and then runs `mail-reload` in panel-rspamd.
enabled = true;
path = "/var/lib/rspamd/dkim/$domain.$selector.key";
selector_map = "/var/lib/rspamd/dkim/selectors.map";
allow_username_mismatch = true;
use_domain = "header";
use_esld = false;
sign_authenticated = true;
sign_local = true;
try_fallback = false;
check_pubkey = false;

schema: 1
slug: static
name: Statische website
description: >-
  Statische site met nginx. Zet je bestanden in de map `public` (via SFTP of de
  filemanager); `index.html` is de startpagina. Eigen nginx-regels (binnen het
  server-blok) kun je kwijt in `nginx/*.conf`. Caddy regelt HTTPS en het domein.
type: web
version: 2
image: nginx:1.28-alpine
# De daemon draait dit als uid 1000 met een read-only rootfs; alleen /home/container en
# /tmp (tmpfs) zijn schrijfbaar. De hoofdconfig wordt bij elke start opnieuw in /tmp
# gezet, zodat een nieuwe templateversie hem meteen bijwerkt; pid, tijdelijke bestanden
# en logs (stdout/stderr) staan nergens op de rootfs.
startup: |
  mkdir -p /tmp/nginx /home/container/public /home/container/nginx &&
  cat > /tmp/nginx/nginx.conf <<'EOF'
  worker_processes 2;
  pid /tmp/nginx/nginx.pid;
  error_log stderr warn;
  events { worker_connections 1024; }
  http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    access_log /dev/stdout combined;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;
    # Caddy (op het site-netwerk) zet X-Forwarded-For.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    server {
      listen 8080;
      root /home/container/public;
      index index.html index.htm;
      absolute_redirect off;
      location ~ /\.(?!well-known/) { deny all; }
      location / { try_files $uri $uri/ =404; }
      include /home/container/nginx/*.conf;
    }
  }
  EOF
  nginx -t -q -e stderr -c /tmp/nginx/nginx.conf &&
  echo "nginx klaar op poort 8080" &&
  exec nginx -e stderr -c /tmp/nginx/nginx.conf -g 'daemon off;'
stop:
  type: signal
  value: SIGQUIT
ready_pattern: "^nginx klaar op poort"
http_port: 8080
variables: []
install:
  image: alpine:3.22
  script: |
    #!/bin/sh
    # Maakt de mappen en een voorbeeldpagina; bestaande bestanden blijven staan.
    set -eu
    cd /home/container
    mkdir -p public nginx
    if [ -z "$(ls -A /home/container/public 2>/dev/null)" ]; then
      mkdir -p /home/container/public
      cat > /home/container/public/index.html <<'EOF'
    <!doctype html>
    <html lang="nl">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Deze website is klaar voor gebruik</title>
    <style>
    :root{color-scheme:light dark;--bg1:#eef2f7;--bg2:#f8fafc;--card:rgba(255,255,255,.86);--line:rgba(15,23,42,.08);--text:#0f172a;--muted:#55627a;--accent:#2563eb;--accent2:#7c3aed;--pill:rgba(37,99,235,.08)}
    @media (prefers-color-scheme:dark){:root{--bg1:#0b1020;--bg2:#111a2e;--card:rgba(17,24,39,.78);--line:rgba(255,255,255,.08);--text:#e5e9f2;--muted:#9aa6bd;--accent:#60a5fa;--accent2:#a78bfa;--pill:rgba(96,165,250,.12)}}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;display:grid;place-items:center;padding:24px;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 60%),radial-gradient(900px 500px at 110% 110%,color-mix(in srgb,var(--accent2) 14%,transparent),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2));-webkit-font-smoothing:antialiased}
    main{width:100%;max-width:520px;padding:40px 36px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.04),0 20px 50px -20px rgba(15,23,42,.25);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:in .5s ease-out both}
    .icon{width:56px;height:56px;display:grid;place-items:center;border-radius:16px;margin-bottom:22px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 24px -10px var(--accent)}
    .icon svg{width:28px;height:28px}
    h1{margin:0 0 10px;font-size:clamp(1.4rem,4vw,1.75rem);line-height:1.25;letter-spacing:-.01em}
    p{margin:0;color:var(--muted)}
    .host{display:inline-block;max-width:100%;margin-top:22px;padding:6px 12px;border-radius:999px;background:var(--pill);color:var(--accent);font:500 .9rem/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere}
    .bar{position:relative;height:4px;margin-top:26px;border-radius:4px;background:var(--line);overflow:hidden}
    .bar::after{content:"";position:absolute;inset:0;width:40%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:slide 1.6s ease-in-out infinite}
    code{font:.92em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:1px 6px;border-radius:6px;background:var(--pill);color:var(--text)}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
    @media (prefers-reduced-motion:reduce){main,.bar::after{animation:none}}
    @media (max-width:480px){main{padding:30px 22px;border-radius:16px}}
    </style>
    </head>
    <body>
    <main>
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1>Deze website is klaar voor gebruik</h1>
    <p>Upload je bestanden naar <code>public/</code> via de filemanager of SFTP.</p>
    <div class="host"><span id="h">deze website</span></div>
    </main>
    <script>document.getElementById("h").textContent=location.hostname||"deze website"</script>

    </body>
    </html>
    EOF
    fi
    [ -e nginx/README.txt ] || echo "Bestanden *.conf in deze map komen binnen het server-blok van nginx (na een herstart)." > nginx/README.txt
    echo "Installatie klaar"
config_files: []

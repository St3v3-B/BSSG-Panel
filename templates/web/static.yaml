schema: 1
slug: static
name: Statische website
description: >-
  Statische site met nginx. Zet je bestanden in de map `public` (via SFTP of de
  filemanager); `index.html` is de startpagina. Eigen nginx-regels (binnen het
  server-blok) kun je kwijt in `nginx/*.conf`. Caddy regelt HTTPS en het domein.
type: web
version: 3
image: nginx:1.28-alpine
# De daemon draait dit als uid 1000 met een read-only rootfs; alleen /home/container en
# /tmp (tmpfs) zijn schrijfbaar. De hoofdconfig wordt bij elke start opnieuw in /tmp
# gezet, zodat een nieuwe templateversie hem meteen bijwerkt; pid, tijdelijke bestanden
# en logs (stdout/stderr) staan nergens op de rootfs.
startup: |
  mkdir -p /tmp/nginx /home/container/public /home/container/nginx &&
  cat > /tmp/nginx/nginx.conf <<'EOF'
  worker_processes 2;
  pid /tmp/nginx/nginx.pid;
  error_log stderr warn;
  events { worker_connections 1024; }
  http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    access_log /dev/stdout combined;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;
    # Caddy (op het site-netwerk) zet X-Forwarded-For.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    server {
      listen 8080;
      root /home/container/public;
      index index.html index.htm;
      absolute_redirect off;
      location ~ /\.(?!well-known/) { deny all; }
      location / { try_files $uri $uri/ =404; }
      include /home/container/nginx/*.conf;
    }
  }
  EOF
  nginx -t -q -e stderr -c /tmp/nginx/nginx.conf &&
  echo "nginx klaar op poort 8080" &&
  exec nginx -e stderr -c /tmp/nginx/nginx.conf -g 'daemon off;'
stop:
  type: signal
  value: SIGQUIT
ready_pattern: "^nginx klaar op poort"
http_port: 8080
variables: []
install:
  image: alpine:3.22
  script: |
    #!/bin/sh
    # Maakt de mappen en een voorbeeldpagina; bestaande bestanden blijven staan.
    set -eu
    cd /home/container
    mkdir -p public nginx
    if [ -z "$(ls -A /home/container/public 2>/dev/null)" ]; then
      mkdir -p /home/container/public
      cat > /home/container/public/index.html <<'EOF'
    <!doctype html>
    <html lang="nl">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Je website staat live 🎉</title>
    <style>
    :root{color-scheme:dark light;--bg:#070a14;--text:#f3f5fb;--muted:#a3adc6;--card:rgba(255,255,255,.055);--edge:rgba(255,255,255,.12);--soft:rgba(255,255,255,.07);--a:#7c5cff;--b:#22d3ee;--c:#f472b6;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--shadow:0 30px 80px -30px rgba(0,0,0,.7)}
    @media (prefers-color-scheme:light){:root{--bg:#f3f5fb;--text:#0b1220;--muted:#4b5672;--card:rgba(255,255,255,.72);--edge:rgba(15,23,42,.1);--soft:rgba(15,23,42,.05);--shadow:0 30px 70px -35px rgba(30,41,82,.35);--a:#6d28d9;--b:#0891b2;--c:#db2777}}
    *{box-sizing:border-box}
    html{height:100%}
    body{margin:0;min-height:100%;display:grid;place-items:center;padding:clamp(16px,4vw,48px);background:var(--bg);color:var(--text);font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    .bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
    .bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
    .bg i:nth-child(1){background:var(--a);top:-20vmax;left:-15vmax}
    .bg i:nth-child(2){background:var(--b);bottom:-25vmax;right:-15vmax;animation-duration:26s;animation-delay:-6s}
    .bg i:nth-child(3){background:var(--c);top:30%;left:45%;width:35vmax;height:35vmax;opacity:.3;animation-duration:30s;animation-delay:-12s}
    .bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--soft) 1px,transparent 1px),linear-gradient(90deg,var(--soft) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 70%);mask-image:radial-gradient(ellipse at center,#000 20%,transparent 70%)}
    @media (prefers-color-scheme:light){.bg i{opacity:.28}.bg i:nth-child(3){opacity:.18}}
    main{position:relative;width:100%;max-width:640px;padding:clamp(28px,5vw,48px);border-radius:28px;background:var(--card);border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
    .top{display:flex;align-items:center;gap:16px;margin-bottom:26px}
    .icon{flex:none;width:60px;height:60px;display:grid;place-items:center;border-radius:18px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 12px 30px -10px var(--a),inset 0 1px 0 rgba(255,255,255,.3)}
    .icon svg{width:30px;height:30px}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--edge);background:var(--soft);font-size:.8rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--s,var(--ok));box-shadow:0 0 0 0 var(--s,var(--ok));animation:ping 2s ease-out infinite}
    h1{margin:0 0 12px;font-size:clamp(2rem,6vw,3rem);line-height:1.08;letter-spacing:-.03em;font-weight:800}
    .lead{margin:0;font-size:clamp(1rem,2.4vw,1.12rem);color:var(--muted);max-width:34em}
    .host{margin:22px 0 0;font:600 clamp(1.05rem,3.2vw,1.35rem)/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere;background:linear-gradient(90deg,var(--a),var(--b),var(--c),var(--a));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
    .host.big{font-size:clamp(1.5rem,5.5vw,2.25rem);letter-spacing:-.02em}
    .nw{white-space:nowrap}
    .bar{height:6px;margin-top:28px;border-radius:6px;background:var(--soft);overflow:hidden}
    .bar b{display:block;width:38%;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--a),var(--b));animation:slide 1.8s cubic-bezier(.6,0,.4,1) infinite}
    .foot{margin:28px 0 0;padding-top:18px;border-top:1px solid var(--edge);font-size:.85rem;color:var(--muted)}
    ol{list-style:none;margin:30px 0 0;padding:0;display:grid;gap:12px}
    li{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:16px;border-radius:18px;background:var(--soft);border:1px solid var(--edge);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
    li:nth-child(1){animation-delay:.15s}li:nth-child(2){animation-delay:.25s}li:nth-child(3){animation-delay:.35s}
    li span{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;font-weight:700;font-size:.95rem;color:#fff;background:linear-gradient(135deg,var(--a),var(--b))}
    li strong{display:block;margin-bottom:2px;font-weight:650}
    li p{margin:0;font-size:.93rem;color:var(--muted)}
    code{font:.9em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:1px 6px;border-radius:6px;background:var(--soft);border:1px solid var(--edge);color:var(--text)}
    .spin{animation:spin 6s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.float{animation:float 3.5s ease-in-out infinite}.draw path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .8s .4s ease-out forwards}
    @keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
    @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
    @keyframes ping{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
    @keyframes shine{to{background-position:300% 0}}
    @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{50%{opacity:.55;transform:scale(.92)}}
    @keyframes float{50%{transform:translateY(-4px)}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.draw path{stroke-dashoffset:0}}
    @media (max-width:480px){main{border-radius:22px}.top{margin-bottom:20px}.icon{width:52px;height:52px;border-radius:15px}}
    </style>
    </head>
    <body>
    <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
    <main>
    <div class="top"><div class="icon"><svg class="draw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div><span class="pill" style="--s:var(--ok)"><span class="dot"></span>Online</span></div>
    <h1>Je website staat <span class="nw">live <span aria-hidden="true">🎉</span></span></h1>
    <p class="lead">Alles draait en HTTPS staat aan. Dit is de standaardpagina; zo maak je er je eigen website van:</p>
    <div class="host big"><span id="h">je nieuwe website</span></div>
    <ol>
    <li><span>1</span><div><strong>Upload je bestanden</strong><p>Zet je website in de map <code>public/</code>, via de filemanager of SFTP.</p></div></li>
    <li><span>2</span><div><strong>Maak een database aan</strong><p>Nodig voor bijvoorbeeld WordPress: maak hem aan in het panel bij deze website.</p></div></li>
    <li><span>3</span><div><strong>Koppel je domein</strong><p>Voeg je eigen domein toe in het panel; het certificaat regelt zich vanzelf.</p></div></li>
    </ol>
    <p class="foot">Deze pagina verdwijnt zodra je een eigen <code>index.html</code> of <code>index.php</code> in <code>public/</code> zet.</p>
    </main>
    <script>var h=location.hostname;if(h)document.getElementById("h").textContent=h</script>
    </body>
    </html>
    EOF
    fi
    [ -e nginx/README.txt ] || echo "Bestanden *.conf in deze map komen binnen het server-blok van nginx (na een herstart)." > nginx/README.txt
    echo "Installatie klaar"
config_files: []

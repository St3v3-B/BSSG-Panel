schema: 1
slug: php-8-4
name: PHP 8.4 (nginx + PHP-FPM)
description: >-
  Website met nginx en PHP-FPM 8.4, geschikt voor WordPress. Zet je bestanden in de map
  `public`; verzoeken die niet op een bestand uitkomen gaan naar `index.php` (permalinks).
  Extensies o.a. mysqli, pdo_mysql, gd, intl, zip, exif, curl, mbstring, opcache.
  De database heet vanuit de site `panel-mariadb:3306`. Eigen PHP-instellingen in
  `php/*.ini`, eigen nginx-regels (binnen het server-blok) in `nginx/*.conf`; daarna herstarten.
type: web
version: 3
# serversideup/php: officiële PHP-build met nginx erbij. We gebruiken alleen de binaries;
# hun s6-entrypoint niet (dat wil als root schrijven op de rootfs).
image: serversideup/php:8.4-fpm-nginx-alpine
# De daemon draait dit als uid 1000 met een read-only rootfs; alleen /home/container en
# /tmp (tmpfs) zijn schrijfbaar. Alle config wordt bij elke start in /tmp gezet. De extra
# extensies (mysqli, gd, intl, exif) bouwt de installatie in /home/container/.php.
startup: |
  set -u
  R=/tmp/php; H=/home/container
  mkdir -p $R/conf.d $R/uploads /tmp/nginx $H/public $H/php $H/nginx $H/.php/sessions
  CH=$(( {{SERVER_MEMORY}} / 64 )); [ "$CH" -ge 2 ] || CH=2
  for f in $H/.php/ext/*.so; do [ -e "$f" ] && echo "extension=$f"; done > $R/conf.d/10-panel-ext.ini
  cat > $R/conf.d/20-panel.ini <<'EOF'
  memory_limit = {{PHP_MEMORY_LIMIT}}
  upload_max_filesize = {{UPLOAD_MAX_SIZE}}
  post_max_size = {{UPLOAD_MAX_SIZE}}
  max_execution_time = 120
  max_input_vars = 3000
  expose_php = Off
  display_errors = Off
  log_errors = On
  date.timezone = Europe/Amsterdam
  sys_temp_dir = /tmp/php
  upload_tmp_dir = /tmp/php/uploads
  session.save_path = /home/container/.php/sessions
  session.cookie_httponly = On
  opcache.enable = 1
  opcache.validate_timestamps = 1
  opcache.revalidate_freq = 2
  opcache.memory_consumption = 64
  EOF
  cat > $R/php-fpm.conf <<EOF
  [global]
  pid = $R/php-fpm.pid
  error_log = /proc/self/fd/2
  log_limit = 8192
  daemonize = no
  [www]
  listen = $R/fpm.sock
  pm = ondemand
  pm.max_children = $CH
  pm.process_idle_timeout = 30s
  pm.max_requests = 500
  clear_env = no
  catch_workers_output = yes
  decorate_workers_output = no
  security.limit_extensions = .php
  ping.path = /healthcheck
  ping.response = OK
  EOF
  cat > /tmp/nginx/nginx.conf <<'EOF'
  worker_processes 2;
  pid /tmp/nginx/nginx.pid;
  error_log stderr warn;
  events { worker_connections 1024; }
  http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    access_log /dev/stdout combined;
    sendfile on;
    server_tokens off;
    client_max_body_size {{UPLOAD_MAX_SIZE}};
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;
    # Caddy (op het site-netwerk) zet X-Forwarded-For en -Proto.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    map $http_x_forwarded_proto $panel_https { https on; default ""; }
    server {
      listen 8080;
      root /home/container/public;
      index index.php index.html index.htm;
      absolute_redirect off;
      location ~ /\.(?!well-known/) { deny all; }
      location ~* /(?:uploads|files)/.*\.php$ { deny all; }
      location / { try_files $uri $uri/ /index.php?$args; }
      location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        try_files $fastcgi_script_name =404;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $panel_https;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300s;
        fastcgi_pass unix:/tmp/php/fpm.sock;
      }
      include /home/container/nginx/*.conf;
    }
    # HEALTHCHECK van de image (curl http://localhost:8080/healthcheck): alleen via
    # 127.0.0.1, test nginx en PHP-FPM (fpm-ping). Een bestand public/healthcheck
    # blijft van buitenaf gewoon bereikbaar via de server hierboven.
    server {
      listen 127.0.0.1:8080;
      access_log off;
      location = /healthcheck {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_NAME /healthcheck;
        fastcgi_param SCRIPT_FILENAME /healthcheck;
        fastcgi_pass unix:/tmp/php/fpm.sock;
      }
      location / { return 404; }
    }
  }
  EOF
  export PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d:$R/conf.d:$H/php ICU_DATA=$H/.php/icu
  LD_LIBRARY_PATH=$H/.php/lib php-fpm -t -y $R/php-fpm.conf 2>&1 | grep -v 'test is successful' >&2
  nginx -t -q -e stderr -c /tmp/nginx/nginx.conf || exit 1
  LD_LIBRARY_PATH=$H/.php/lib php-fpm -y $R/php-fpm.conf & FPM=$!
  nginx -e stderr -c /tmp/nginx/nginx.conf -g 'daemon off;' & NGX=$!
  STOP=0
  trap 'STOP=1; kill -QUIT $NGX $FPM 2>/dev/null' TERM INT QUIT
  until [ -S $R/fpm.sock ] && [ -s /tmp/nginx/nginx.pid ]; do
    kill -0 $FPM 2>/dev/null && kill -0 $NGX 2>/dev/null || break
    sleep 0.2
  done
  kill -0 $FPM 2>/dev/null && kill -0 $NGX 2>/dev/null && echo "PHP-FPM en nginx klaar op poort 8080"
  while kill -0 $FPM 2>/dev/null && kill -0 $NGX 2>/dev/null; do sleep 1 & wait $!; done
  kill -QUIT $NGX $FPM 2>/dev/null; wait $NGX; wait $FPM
  [ "$STOP" = 1 ] && exit 0
  echo "PHP-FPM of nginx is gestopt" >&2; exit 1
stop:
  type: signal
  value: SIGTERM
ready_pattern: "^PHP-FPM en nginx klaar op poort"
http_port: 8080
variables:
  - key: PHP_MEMORY_LIMIT
    name: PHP-geheugenlimiet
    description: memory_limit per PHP-verzoek, bijvoorbeeld 256M.
    default: 256M
    user_editable: true
    pattern: "^[0-9]{2,5}M$"
  - key: UPLOAD_MAX_SIZE
    name: Maximale uploadgrootte
    description: upload_max_filesize, post_max_size en de nginx-limiet, bijvoorbeeld 64M.
    default: 64M
    user_editable: true
    pattern: "^[0-9]{1,4}M$"
install:
  image: serversideup/php:8.4-fpm-nginx-alpine
  script: |
    #!/bin/sh
    # Bouwt mysqli, gd, intl en exif tegen exact deze PHP-build (zelfde image als de
    # runtime) en zet ze met de benodigde bibliotheken in /home/container/.php.
    # Draait als root in een tijdelijke container; bestaande sitebestanden blijven staan.
    set -eu
    H=/home/container
    mkdir -p $H/php $H/nginx $H/.php/sessions
    rm -rf $H/.php/ext $H/.php/lib $H/.php/icu
    mkdir -p $H/.php/ext $H/.php/lib
    ls /lib /usr/lib /usr/local/lib > /tmp/libs-before
    echo "Bouwtools installeren"
    apk add --no-cache --virtual .panel-build $PHPIZE_DEPS \
      libpng-dev libjpeg-turbo-dev freetype-dev libwebp-dev icu-dev icu-data-full >/dev/null
    docker-php-source extract
    for e in mysqli gd intl exif; do
      echo "Extensie $e bouwen"
      cd /usr/src/php/ext/$e
      phpize >/dev/null
      case $e in
        gd) ./configure --with-freetype --with-jpeg --with-webp >/dev/null ;;
        *) ./configure >/dev/null ;;
      esac
      make -j"$(nproc)" >/dev/null 2>&1 || make >/dev/null
      cp modules/$e.so $H/.php/ext/
    done
    # Bibliotheken die de runtime-image niet heeft (libpng, icu, ...) erbij zetten.
    for so in $H/.php/ext/*.so; do
      ldd "$so" 2>/dev/null | awk '$2 == "=>" && $3 ~ /^\// {print $3}'
    done | sort -u | while read -r lib; do
      base=$(basename "$lib")
      grep -qx "$base" /tmp/libs-before || cp -L "$lib" $H/.php/lib/
    done
    # ICU-data (alle talen) voor intl; de runtime vindt hem via ICU_DATA.
    mkdir -p $H/.php/icu
    cp /usr/share/icu/*/*.dat $H/.php/icu/
    if [ -z "$(ls -A /home/container/public 2>/dev/null)" ]; then
      mkdir -p /home/container/public
      cat > /home/container/public/index.html <<'EOF'
    <!doctype html>
    <html lang="nl">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Deze website is klaar voor gebruik</title>
    <style>
    :root{color-scheme:light dark;--bg1:#eef2f7;--bg2:#f8fafc;--card:rgba(255,255,255,.86);--line:rgba(15,23,42,.08);--text:#0f172a;--muted:#55627a;--accent:#2563eb;--accent2:#7c3aed;--pill:rgba(37,99,235,.08)}
    @media (prefers-color-scheme:dark){:root{--bg1:#0b1020;--bg2:#111a2e;--card:rgba(17,24,39,.78);--line:rgba(255,255,255,.08);--text:#e5e9f2;--muted:#9aa6bd;--accent:#60a5fa;--accent2:#a78bfa;--pill:rgba(96,165,250,.12)}}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;display:grid;place-items:center;padding:24px;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 60%),radial-gradient(900px 500px at 110% 110%,color-mix(in srgb,var(--accent2) 14%,transparent),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2));-webkit-font-smoothing:antialiased}
    main{width:100%;max-width:520px;padding:40px 36px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.04),0 20px 50px -20px rgba(15,23,42,.25);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:in .5s ease-out both}
    .icon{width:56px;height:56px;display:grid;place-items:center;border-radius:16px;margin-bottom:22px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 24px -10px var(--accent)}
    .icon svg{width:28px;height:28px}
    h1{margin:0 0 10px;font-size:clamp(1.4rem,4vw,1.75rem);line-height:1.25;letter-spacing:-.01em}
    p{margin:0;color:var(--muted)}
    .host{display:inline-block;max-width:100%;margin-top:22px;padding:6px 12px;border-radius:999px;background:var(--pill);color:var(--accent);font:500 .9rem/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere}
    .bar{position:relative;height:4px;margin-top:26px;border-radius:4px;background:var(--line);overflow:hidden}
    .bar::after{content:"";position:absolute;inset:0;width:40%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:slide 1.6s ease-in-out infinite}
    code{font:.92em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:1px 6px;border-radius:6px;background:var(--pill);color:var(--text)}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
    @media (prefers-reduced-motion:reduce){main,.bar::after{animation:none}}
    @media (max-width:480px){main{padding:30px 22px;border-radius:16px}}
    </style>
    </head>
    <body>
    <main>
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1>Deze website is klaar voor gebruik</h1>
    <p>Upload je bestanden naar <code>public/</code> via de filemanager of SFTP.</p>
    <div class="host"><span id="h">deze website</span></div>
    </main>
    <script>document.getElementById("h").textContent=location.hostname||"deze website"</script>

    </body>
    </html>
    EOF
    fi
    [ -e $H/php/README.txt ] || echo "Bestanden *.ini in deze map komen na de standaardinstellingen (na een herstart)." > $H/php/README.txt
    [ -e $H/nginx/README.txt ] || echo "Bestanden *.conf in deze map komen binnen het server-blok van nginx (na een herstart)." > $H/nginx/README.txt
    PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d LD_LIBRARY_PATH=$H/.php/lib ICU_DATA=$H/.php/icu \
      php $(for f in $H/.php/ext/*.so; do printf -- '-d extension=%s ' "$f"; done) -r 'echo (new NumberFormatter("nl_NL", NumberFormatter::DECIMAL))->format(1.5), " ", function_exists("mysqli_connect") ? "mysqli" : "";' | grep -qx '1,5 mysqli'
    echo "Installatie klaar: PHP $(php -r 'echo PHP_VERSION;')"
config_files: []

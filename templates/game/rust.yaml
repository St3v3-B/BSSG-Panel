schema: 1
slug: rust
name: Rust
description: >-
  Rust dedicated server (Steam app 258550, installed with SteamCMD). Ports: the game port (UDP,
  default 28015) and, with extra allocations, RCON (TCP, game + 1), the Steam query port (UDP,
  game + 2; needed for the server browser) and the Rust+ app port (TCP). Map and saves are in
  `server/rust`. Console commands: the console of the panel works for commands Rust reads from
  stdin; for full remote control use WebRCON with `RCON_PASSWORD`. A new seed or world size
  creates a new map (wipe). Updating: reinstall (saves stay; after a forced Rust update a wipe may
  still be required by Facepunch). Recommended: 12 GB RAM (at least 8 GB), 20 GB disk.
type: game
version: 1
image: ghcr.io/ptero-eggs/steamcmd:debian
# -logfile -: Unity logt naar stdout (console van het panel). Gebruikerstekst via de env.
startup: >-
  export LD_LIBRARY_PATH="/home/container:/home/container/RustDedicated_Data/Plugins/x86_64:${LD_LIBRARY_PATH:-}";
  exec ./RustDedicated -batchmode -nographics -logfile -
  +server.ip 0.0.0.0 +server.port {{SERVER_PORT}} +server.queryport {{QUERY_PORT}}
  +rcon.ip 0.0.0.0 +rcon.port {{RCON_PORT}} +rcon.web 1 +rcon.password "$RCON_PASSWORD"
  +app.port {{APP_PORT}}
  +server.hostname "$SERVER_NAME" +server.description "$SERVER_DESCRIPTION"
  +server.maxplayers {{MAX_PLAYERS}} +server.level "Procedural Map"
  +server.worldsize {{WORLD_SIZE}} +server.seed {{SEED}}
  +server.identity rust +server.saveinterval {{SAVE_INTERVAL}}
# Rust slaat bij SIGINT op en stopt; grote maps hebben daar even voor nodig.
stop:
  type: signal
  value: SIGINT
  timeout: 180
ready_pattern: "Server startup complete"
recommended:
  memory_mb: 12288
  disk_mb: 20480
ports:
  - env: SERVER_PORT
    name: Game
    protocol: udp
  - env: RCON_PORT
    name: RCON
    protocol: tcp
    offset: 1
  - env: QUERY_PORT
    name: Steam query
    protocol: udp
    offset: 2
  - env: APP_PORT
    name: Rust+ app
    protocol: tcp
    offset: 67
variables:
  - key: SERVER_NAME
    name: Server name
    default: My Rust server
    user_editable: true
    pattern: "^[A-Za-z0-9 _.,!?#()+:'|-]{1,64}$"
  - key: SERVER_DESCRIPTION
    name: Description
    default: A Rust server
    user_editable: true
    pattern: "^[A-Za-z0-9 _.,!?#()+:'|-]{0,256}$"
  - key: MAX_PLAYERS
    name: Max players
    default: "50"
    user_editable: true
    pattern: "^([1-9][0-9]{0,2})$"
  - key: WORLD_SIZE
    name: World size
    description: 1000 to 6000 (default 3500). Changing it creates a new map.
    default: "3500"
    user_editable: true
    pattern: "^([1-5][0-9]{3}|6000)$"
  - key: SEED
    name: Map seed
    description: 0 to 2147483647. Changing it creates a new map.
    default: "12345"
    user_editable: true
    pattern: "^[0-9]{1,9}$"
  - key: SAVE_INTERVAL
    name: Save interval
    description: Seconds between saves.
    default: "300"
    user_editable: true
    pattern: "^([6-9][0-9]|[1-9][0-9]{2,3})$"
  - key: RCON_PASSWORD
    name: RCON password
    description: Empty = RCON off.
    default: ""
    user_editable: true
    pattern: "^[A-Za-z0-9!#%()*+,.:;=?@^_~-]{0,64}$"
install:
  image: steamcmd/steamcmd:debian-12
  timeout_minutes: 120
  script: |
    #!/bin/sh
    # SteamCMD (anoniem) installeert of werkt bij naar /home/container; server/ (map, saves) blijft staan.
    set -eu
    APP=258550
    cd /home/container
    export HOME=/root
    ok() { grep -qE '"StateFlags"[[:space:]]+"4"' "steamapps/appmanifest_$APP.acf" 2>/dev/null; }
    for n in 1 2 3; do
      steamcmd +force_install_dir /home/container +login anonymous +app_update "$APP" validate +quit || true
      ok && break
      echo "SteamCMD did not finish (attempt $n of 3)"; [ "$n" = 3 ] || sleep 10
    done
    ok || { echo "SteamCMD could not install app $APP" >&2; exit 1; }
    mkdir -p .steam/sdk64 .steam/sdk32
    cp -f /root/.local/share/Steam/steamcmd/linux64/steamclient.so .steam/sdk64/steamclient.so
    cp -f /root/.local/share/Steam/steamcmd/linux32/steamclient.so .steam/sdk32/steamclient.so
    chmod +x RustDedicated
    echo "Installation complete: Rust (app $APP)"
config_files: []

schema: 1
slug: terraria
name: Terraria
description: >-
  Terraria dedicated server (the official server from terraria.org, no SteamCMD). Port: the game
  port (TCP, default 7777). On the first start the world is created with the chosen size,
  difficulty and seed; worlds are in `worlds/`. `exit` in the console (or Stop) saves the world.
  Pick a version (for example 1449 for 1.4.4.9) or `latest`; reinstall after changing (worlds
  stay). Recommended: 1 GB RAM (2 GB for large worlds), 2 GB disk.
type: game
version: 1
image: debian:12-slim
# Optionele argumenten alleen als ze gezet zijn; tekst via de env.
startup: >-
  mkdir -p worlds;
  set -- ;
  if [ -n "$SERVER_PASSWORD" ]; then set -- "$@" -password "$SERVER_PASSWORD"; fi;
  if [ -n "$WORLD_SEED" ]; then set -- "$@" -seed "$WORLD_SEED"; fi;
  if [ -n "$MOTD" ]; then set -- "$@" -motd "$MOTD"; fi;
  exec ./TerrariaServer.bin.x86_64 -port {{SERVER_PORT}} -maxplayers {{MAX_PLAYERS}}
  -world "/home/container/worlds/$WORLD_NAME.wld" -autocreate {{WORLD_SIZE}} -worldname "$WORLD_NAME"
  -difficulty {{DIFFICULTY}} -secure -noupnp "$@"
stop:
  type: command
  value: exit
  timeout: 60
# Terraria logt: Server started
ready_pattern: "Server started"
recommended:
  memory_mb: 1024
  disk_mb: 2048
ports:
  - env: SERVER_PORT
    name: Game
    protocol: tcp
variables:
  - key: TERRARIA_VERSION
    name: Terraria version
    description: For example 1449 (= 1.4.4.9); `latest` = newest. Reinstall after changing.
    default: latest
    user_editable: true
    pattern: "^(latest|[0-9]{3,5})$"
  - key: WORLD_NAME
    name: World
    description: Name of the world file in worlds/; a new name creates a new world.
    default: World
    user_editable: true
    pattern: "^[A-Za-z0-9_-]{1,32}$"
  - key: WORLD_SIZE
    name: World size
    description: 1 = small, 2 = medium, 3 = large (only when the world is created).
    default: "2"
    user_editable: true
    pattern: "^[123]$"
  - key: DIFFICULTY
    name: Difficulty
    description: 0 = classic, 1 = expert, 2 = master, 3 = journey (only when the world is created).
    default: "0"
    user_editable: true
    pattern: "^[0-3]$"
  - key: WORLD_SEED
    name: Seed
    description: Empty = random (only when the world is created).
    default: ""
    user_editable: true
    pattern: "^[A-Za-z0-9_ -]{0,32}$"
  - key: MAX_PLAYERS
    name: Max players
    default: "8"
    user_editable: true
    pattern: "^([1-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$"
  - key: SERVER_PASSWORD
    name: Password
    description: Empty = no password.
    default: ""
    user_editable: true
    pattern: "^[A-Za-z0-9!#%()*+,.:;=?@^_~-]{0,64}$"
  - key: MOTD
    name: Message of the day
    default: ""
    user_editable: true
    pattern: "^[A-Za-z0-9 _.,!?#()+:'-]{0,128}$"
install:
  image: alpine:3.22
  script: |
    #!/bin/sh
    # Haalt de officiële dedicated server van terraria.org (HTTPS) en zet de Linux-bestanden in /home/container.
    # worlds/ en eigen bestanden blijven staan.
    set -eu
    cd /home/container
    apk add --no-cache curl jq unzip >/dev/null
    UA="panel-installer/1 (self-hosted panel)"
    V="${TERRARIA_VERSION:-latest}"
    if [ "$V" = latest ]; then
      FILE=$(curl -fsSL --retry 3 -A "$UA" https://terraria.org/api/get/dedicated-servers-names | jq -r '.[0]')
    else
      FILE="terraria-server-$V.zip"
    fi
    case "$FILE" in terraria-server-[0-9]*.zip) ;; *) echo "No Terraria server version found" >&2; exit 1 ;; esac
    echo "Downloading $FILE"
    curl -fsSL --retry 3 -A "$UA" -o /tmp/terraria.zip "https://terraria.org/api/download/pc-dedicated-server/$FILE" \
      || { echo "Download of $FILE failed (unknown version?)" >&2; exit 1; }
    rm -rf /tmp/t && mkdir /tmp/t && unzip -q /tmp/terraria.zip -d /tmp/t
    SRC=$(find /tmp/t -maxdepth 3 -type d -name Linux | head -n 1)
    [ -n "$SRC" ] && [ -f "$SRC/TerrariaServer.bin.x86_64" ] || { echo "No Linux server in $FILE" >&2; exit 1; }
    cp -a "$SRC"/. /home/container/
    chmod +x TerrariaServer.bin.x86_64 TerrariaServer 2>/dev/null || chmod +x TerrariaServer.bin.x86_64
    rm -rf /tmp/t /tmp/terraria.zip
    mkdir -p worlds
    echo "$FILE" > .terraria-install
    echo "Installation complete: $FILE"
config_files: []

schema: 1
slug: node-generic
name: Generic Node.js
description: >-
  Runs your own Node.js app (for example a Discord bot) with Node.js 24 (LTS). Put your
  code in the root directory via SFTP or the file manager. With a package.json, every start
  runs `npm ci` (with package-lock.json) or `npm install`, without devDependencies; turn this off
  with `AUTO_INSTALL=false`. The server counts as online as soon as Node starts. It is stopped with
  SIGTERM: if your app has no SIGTERM handler of its own, Node exits immediately. The app gets
  its port in `SERVER_PORT` (listen on 0.0.0.0).
type: game
version: 2
image: node:24-alpine
# HOME en de npm-cache in /home/container: de rootfs is read-only. De --import zorgt dat
# SIGTERM werkt, ook als Node PID 1 is (dan negeert de kernel het zonder handler).
startup: >-
  export HOME=/home/container npm_config_cache=/home/container/.npm npm_config_update_notifier=false NODE_ENV=production;
  if [ "{{AUTO_INSTALL}}" = true ] && [ -f package.json ]; then
  if [ -f package-lock.json ]; then npm ci --omit=dev --no-audit --no-fund; else npm install --omit=dev --no-audit --no-fund; fi || exit 1; fi;
  [ -f {{MAIN_FILE}} ] || { echo "[panel] {{MAIN_FILE}} is missing: put your code in the root directory"; exit 1; };
  echo "[panel] starting {{MAIN_FILE}} with Node $(node --version)";
  exec node --import 'data:text/javascript,process.once("SIGTERM",()=>{if(!process.listenerCount("SIGTERM"))process.exit(143)})'
  {{NODE_ARGS}} {{MAIN_FILE}}
stop:
  type: signal
  value: SIGTERM
ready_pattern: "^\\[panel\\] starting "
variables:
  - key: MAIN_FILE
    name: Start file
    description: The file Node runs, for example index.js or dist/bot.mjs.
    default: index.js
    user_editable: true
    pattern: "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*\\.(js|mjs|cjs)$"
  - key: AUTO_INSTALL
    name: Install dependencies
    description: "`true` = run npm ci/install on every start if a package.json exists."
    default: "true"
    user_editable: true
    pattern: "^(true|false)$"
  - key: NODE_ARGS
    name: Extra Node options
    description: For example --enable-source-maps.
    default: ""
    user_editable: true
    pattern: "^[A-Za-z0-9_=:.,+/ -]*$"
install:
  image: alpine:3.22
  script: |
    #!/bin/sh
    # Niets te downloaden: Node zit in de runtime-image. Alleen een voorbeeld als de map leeg is.
    set -eu
    cd /home/container
    if [ ! -f package.json ] && [ ! -f index.js ]; then
      cat > index.js <<'EOF'
    // Example: replace this with your own app (via SFTP or the file manager).
    const http = require("node:http");
    const port = Number(process.env.SERVER_PORT || 3000);
    http.createServer((req, res) => res.end("Hello from Node.js\n")).listen(port, "0.0.0.0", () => {
      console.log(`listening on port ${port}`);
    });
    EOF
      echo "Example index.js created"
    fi
    echo "Installation complete"
config_files: []

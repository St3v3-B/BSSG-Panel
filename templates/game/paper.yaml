schema: 1
slug: paper
name: Paper
description: >-
  Minecraft Java Edition with Paper (papermc.io). Pick a Minecraft version or `latest`
  (newest stable version); the installer fetches the jar via the PaperMC API and verifies
  the SHA-256. Runs on Java 25 (Minecraft 1.20.5 and newer; see the generic Java template
  for older versions). Heap = RAM limit minus max(25%, 512 MB) (at least 512 MB heap); recommended minimum: 1.5 GB RAM.
  Behind a Velocity proxy: set `VELOCITY_FORWARDING` to `true` and `VELOCITY_SECRET` to the
  same secret as the proxy (see deploy/README.md, "Velocity with two Paper servers").
type: game
version: 5
image: eclipse-temurin:25-jre
# Heap: SERVER_MEMORY min max(25%, 512 MB), heap minstens 512 MB; direct memory en code cache begrensd voor metaspace, threads, netty-buffers en
# /tmp (tmpfs, telt mee); met 80% werd Paper 1.21.x bij 1280 MB door de cgroup OOM-killed.
# Flags: Aikar/PaperMC-aanbevolen G1-instellingen (zonder AlwaysPreTouch, zodat een
# server niet bij de start meteen zijn hele heap vastlegt).
# -Duser.home en de netty-map: de rootfs is read-only en /tmp is een tmpfs (noexec).
# Achter Velocity moet online-mode in server.properties uit (Velocity doet de login en Paper
# controleert de secret); config_files zet hem eerst op ONLINE_MODE, dus bij
# VELOCITY_FORWARDING=false komt de eigen waarde vanzelf terug.
startup: >-
  if [ "{{VELOCITY_FORWARDING}}" = true ]; then sed -i 's/^online-mode=.*/online-mode=false/' server.properties; fi &&
  HEADROOM=$(( {{SERVER_MEMORY}} / 4 > 512 ? {{SERVER_MEMORY}} / 4 : 512 )) &&
  HEAP=$(( {{SERVER_MEMORY}} - HEADROOM > 512 ? {{SERVER_MEMORY}} - HEADROOM : 512 )) &&
  mkdir -p .cache/netty &&
  exec java
  -Xms${HEAP}M -Xmx${HEAP}M -XX:MaxDirectMemorySize=256M -XX:ReservedCodeCacheSize=128M
  -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200
  -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+PerfDisableSharedMem
  -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M
  -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4
  -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90
  -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:MaxTenuringThreshold=1
  -Duser.home=/home/container -Dio.netty.native.workdir=/home/container/.cache/netty
  -Dterminal.jline=false -Dterminal.ansi=true
  -jar {{SERVER_JARFILE}} --nogui
stop:
  type: command
  value: stop
# Paper logt: [12:00:00 INFO]: Done (12.345s)! For help, type "help"
sleep_capable: true
ready_pattern: "Done \\([0-9.,]+s\\)!"
variables:
  - key: MINECRAFT_VERSION
    name: Minecraft version
    description: For example 1.21.11 or 26.3; `latest` = newest stable version. Reinstall after changing.
    default: latest
    user_editable: true
    pattern: "^(latest|[0-9]+(\\.[0-9]+){1,2}(-[A-Za-z0-9.-]+)?)$"
  - key: BUILD
    name: Paper build
    description: Paper build number; `latest` = newest build of that version. Reinstall after changing.
    default: latest
    user_editable: true
    pattern: "^(latest|[0-9]+)$"
  - key: VELOCITY_FORWARDING
    name: Behind Velocity (modern forwarding)
    description: >-
      `true` = only players coming through a Velocity proxy with the same secret (Paper checks the
      login via the proxy). Default `false`. Restart required.
    default: "false"
    user_editable: true
    pattern: "^(true|false)$"
  - key: VELOCITY_SECRET
    name: Velocity secret
    description: >-
      Must equal the forwarding secret of the Velocity server (variable
      VELOCITY_FORWARDING_SECRET or the forwarding.secret file there). Only needed when
      VELOCITY_FORWARDING is `true`.
    default: ""
    user_editable: true
    pattern: "^([A-Za-z0-9_-]{12,128})?$"
  - key: ONLINE_MODE
    name: Online mode
    description: >-
      `true` = players must have a real Minecraft account (recommended). With
      VELOCITY_FORWARDING=true it is switched off automatically in server.properties (the proxy
      checks the accounts).
    default: "true"
    user_editable: true
    pattern: "^(true|false)$"
  - key: SERVER_JARFILE
    name: Jar file
    description: Name of the server jar in the root directory.
    default: server.jar
    user_editable: false
    pattern: "^[A-Za-z0-9._-]+\\.jar$"
install:
  image: alpine:3.22
  script: |
    #!/bin/sh
    # Haalt Paper via de PaperMC Fill-API (v3), controleert de SHA-256 en accepteert de EULA.
    # Draait als root in een tijdelijke container; de daemon zet daarna de eigenaar op 1000.
    set -eu
    API="https://fill.papermc.io/v3/projects/paper"
    UA="panel-installer/1 (self-hosted panel)"
    cd /home/container
    apk add --no-cache curl jq >/dev/null

    fetch() { curl -fsSL --retry 3 --retry-delay 2 -A "$UA" "$1"; }

    VERSION="${MINECRAFT_VERSION:-latest}"
    if [ "$VERSION" = "latest" ]; then
      # Eerste versie zonder -rc/-pre in de (nieuwste-eerst) lijst.
      VERSION=$(fetch "$API/versions" | jq -r '[.versions[].version.id | select(test("^[0-9]+(\\.[0-9]+)*$"))][0]')
    fi
    [ -n "$VERSION" ] && [ "$VERSION" != "null" ] || { echo "No Minecraft version found" >&2; exit 1; }

    INFO=$(fetch "$API/versions/$VERSION") || { echo "Unknown Minecraft version: $VERSION" >&2; exit 1; }
    JAVA_MIN=$(echo "$INFO" | jq -r '.version.java.version.minimum // empty')
    if [ -n "$JAVA_MIN" ] && [ "$JAVA_MIN" -gt 25 ]; then
      echo "Paper $VERSION requires Java $JAVA_MIN; this template runs Java 25." >&2
      exit 1
    fi

    B="${BUILD:-latest}"
    BUILD_JSON=$(fetch "$API/versions/$VERSION/builds/$B") || { echo "Build $B of $VERSION not found" >&2; exit 1; }
    URL=$(echo "$BUILD_JSON" | jq -r '.downloads["server:default"].url')
    SHA=$(echo "$BUILD_JSON" | jq -r '.downloads["server:default"].checksums.sha256')
    ID=$(echo "$BUILD_JSON" | jq -r '.id')
    [ "$URL" != "null" ] && [ "$SHA" != "null" ] || { echo "No download in the API response" >&2; exit 1; }

    echo "Downloading Paper $VERSION build $ID"
    curl -fsSL --retry 3 --retry-delay 2 -A "$UA" -o "$SERVER_JARFILE.part" "$URL"
    echo "$SHA  $SERVER_JARFILE.part" | sha256sum -c - >/dev/null || { echo "SHA-256 mismatch" >&2; rm -f "$SERVER_JARFILE.part"; exit 1; }
    mv -f "$SERVER_JARFILE.part" "$SERVER_JARFILE"

    echo "eula=true" > eula.txt
    [ -f server.properties ] || printf 'motd=A Paper server\nenable-rcon=false\n' > server.properties
    printf 'version=%s\nbuild=%s\n' "$VERSION" "$ID" > .paper-install
    echo "Installation complete: Paper $VERSION build $ID"
config_files:
  # server-ip 0.0.0.0: in de container op alle interfaces luisteren; Docker publiceert de
  # poort op het IP van de allocation (SERVER_IP binden zou in de container niet werken).
  - path: server.properties
    format: properties
    set:
      server-port: "{{SERVER_PORT}}"
      server-ip: "0.0.0.0"
      query.port: "{{SERVER_PORT}}"
      online-mode: "{{ONLINE_MODE}}"
  # Velocity modern forwarding. Standaard uit; Paper vult de rest van het bestand zelf aan.
  - path: config/paper-global.yml
    format: yaml
    set:
      proxies.velocity.enabled: "{{VELOCITY_FORWARDING}}"
      proxies.velocity.online-mode: "true"
      proxies.velocity.secret: "{{VELOCITY_SECRET}}"

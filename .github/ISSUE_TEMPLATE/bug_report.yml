name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove real domains, tokens, IP addresses and Discord IDs from anything you paste.
        Security problems go through a private advisory, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Panel UI, Panel API, Daemon, Caddy / domains / SSL, Templates, Installer / deploy, Backups, Multi-node, Minecraft, Websites, Docs, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `git rev-parse --short HEAD` in your checkout.
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS and version, Docker version, single machine or multi-node, browser if it is a UI problem.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `journalctl -u panel-daemon`, `docker logs panel-web` or `docker logs panel-caddy`.
      render: text

name: check

on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # versie uit packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: daemon/go.sum

      # db-migrate-test draait een lege Postgres via Docker (aanwezig op GitHub-runners).
      # De daemon draait in productie als root (chown naar uid 1000, Docker-socket); de Go-tests
      # doen hetzelfde, dus als root met de toolchain van de setup-acties in PATH.
      - run: sudo -E env "PATH=$PATH" "HOME=$HOME" make check

      - if: failure()
        run: sudo docker ps -a --filter label=panel.test=true --format '{{.Names}} {{.Status}}' | head -50

openapi: 3.1.0
info:
  title: Panel remote API (daemon → panel)
  version: 1.0.0
  description: |
    Endpoints op het panel die alleen daemons aanroepen. Eigenaar: orchestrator;
    panel-api implementeert ze als route handlers onder `apps/web/app/api/remote/`,
    de daemon roept ze aan op `PANEL_URL` (standaard `https://$PANEL_DOMAIN`).

    Authenticatie: `Authorization: Bearer <NODE_TOKEN>`; het panel zoekt de node op via
    de hash van het token. Alle antwoorden JSON. Bij 5xx of netwerkfout probeert de daemon
    het opnieuw met backoff (max 10 min), behalve bij sftp/auth.
servers:
  - url: https://{panelDomain}
    variables:
      panelDomain:
        default: panel.test
security:
  - nodeToken: []
paths:
  /api/remote/jwt-key:
    get:
      operationId: getJwtKey
      summary: Publieke sleutel(s) om browser-JWT's te controleren
      responses:
        "200":
          description: JWKS (Ed25519, alg EdDSA)
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kty, crv, x, kid, alg]
                      properties:
                        kty: { const: OKP }
                        crv: { const: Ed25519 }
                        x: { type: string }
                        kid: { type: string }
                        alg: { const: EdDSA }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/remote/node/hello:
    post:
      operationId: nodeHello
      summary: Bij opstarten; panel werkt disk_quota_mode en versie bij
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, disk_quota_mode]
              properties:
                version: { type: string }
                disk_quota_mode: { type: string, enum: [soft, xfs] }
                has_mariadb:
                  type: boolean
                  description: |
                    De node heeft een bereikbare lokale MariaDB (panel-mariadb). Het panel registreert dan een
                    daemon-beheerde `database_hosts`-rij voor de node. De daemon meldt zich opnieuw (hello) als dit verandert.
      responses:
        "204": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/remote/acme/dns:
    post:
      operationId: acmeDns
      summary: DNS-01-challenge voor het node-domein (nodes zonder Caddy op 443)
      description: |
        De daemon zet bij nodes met `supports_domains = false` zelf een Let's Encrypt-certificaat voor `$NODE_DOMAIN` op
        `DAEMON_TLS_PORT` (public_port). De DNS-01-challenge doet het panel: het zet/verwijdert via Cloudflare het TXT-record
        `_acme-challenge.<fqdn>` van **de eigen node** (geen ander domein). Het Cloudflare-token verlaat het panel nooit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, value]
              properties:
                action: { type: string, enum: [present, cleanup] }
                value: { type: string, description: "De TXT-waarde (base64url sha256 van de key authorization)" }
      responses:
        "204": { description: OK }
        "400": { description: Geen Cloudflare-koppeling voor deze zone }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/remote/relay:
    get:
      operationId: getRelayConfig
      summary: HTTP(S)-relay-configuratie van deze node
      description: |
        De daemon haalt dit bij de start, elke minuut en na `POST /api/relay/refresh` op (en bewaart het in
        `state/relay.json`). `edge`: deze node (B) laat zijn HTTP(S) via een andere node (A) lopen; `clients`: de nodes
        die via deze node lopen, met **alleen** de hostnamen die het panel aan die node heeft toegewezen (plus
        hun node-domein). Het geheim is per paar A↔B en staat versleuteld in `nodes.relay_secret_enc` van B.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/remote/relay/status:
    post:
      operationId: reportRelayStatus
      summary: Toestand van de tunnel van deze node (als client)
      description: Bij verbinden, verbreken en elke minuut. Het panel toont het in Admin → Nodes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [edge_node_id, connected]
              properties:
                edge_node_id: { type: integer }
                connected: { type: boolean }
                connected_at: { type: [string, "null"], format: date-time }
                latency_ms: { type: [number, "null"] }
                last_error: { type: [string, "null"], maxLength: 500 }
                last_error_at: { type: [string, "null"], format: date-time }
                reconnects: { type: integer }
                http_mode: { type: string, enum: [direct, relay] }
      responses:
        "204": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/join/exchange:
    post:
      operationId: joinExchange
      summary: Join-code inruilen voor token en configuratie (publiek; de code is de authenticatie)
      description: |
        Eenmalig, ≤ 1 uur na het aanmaken. Het panel zet (indien Cloudflare de zone dekt) het A-record naar `ip`.
        Ongeldige, verlopen of gebruikte codes geven 404 `invalid_code`. Ratelimit per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, ip]
              properties:
                code: { type: string }
                ip: { type: string, description: IPv4 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [node_token, panel_url, node_domain, acme_email, daemon_port, sftp_port, supports_domains, public_port, dns_mode, http_mode, dns_ip]
                properties:
                  node_token: { type: string }
                  panel_url: { type: string }
                  node_domain: { type: string }
                  acme_email: { type: string }
                  daemon_port: { type: integer }
                  sftp_port: { type: integer }
                  supports_domains: { type: boolean }
                  public_port: { type: integer }
                  dns_mode: { type: string, enum: [cloudflare, manual] }
                  http_mode: { type: string, enum: [direct, relay], description: "relay: HTTP(S) via een andere node; Caddy zonder publieke poorten (compose-profiel caddy-relay)" }
                  dns_ip: { type: string, description: "IPv4 waar node_domain naar moet wijzen: het eigen IP, of dat van de relay-node bij http_mode relay" }
        "404": { description: invalid_code }
        "429": { description: Te veel pogingen }

  /api/join/progress:
    post:
      operationId: joinProgress
      summary: Voortgang van het join-script (Bearer node-token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [docker, download, dns, daemon, certificate, ready, failed] }
                message: { type: string, maxLength: 500 }
      responses:
        "204": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/remote/settings/image-updates:
    get:
      operationId: getImageUpdateSettings
      summary: Globale instellingen voor image-updates (de daemon haalt ze elk uur en bij elke controle op)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [default_policy, window_start, window_end, timezone]
                properties:
                  default_policy: { type: string, enum: [auto, notify, off] }
                  window_start: { type: string, example: "04:00" }
                  window_end: { type: string, example: "05:00", description: "mag voor window_start liggen (over middernacht)" }
                  timezone: { type: string, example: Europe/Amsterdam }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/remote/node/images:
    post:
      operationId: reportImages
      summary: Resultaat van een image-controle, per server (vervangt de vorige status)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servers]
              properties:
                servers:
                  type: array
                  items:
                    type: object
                    required: [uuid, image, update_available, reinstall_required, checked_at]
                    properties:
                      uuid: { type: string, format: uuid }
                      image: { type: string }
                      current_image_id: { type: [string, "null"], description: "image-id van de draaiende container" }
                      latest_image_id: { type: [string, "null"] }
                      update_available: { type: boolean }
                      reinstall_required: { type: boolean }
                      checked_at: { type: string, format: date-time }
      responses:
        "204": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/remote/servers/{uuid}/image-update:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      operationId: reportImageUpdate
      summary: Een image-update is toegepast of mislukt (voor het activiteitenlog)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [successful, mode]
              properties:
                successful: { type: boolean }
                mode: { type: string, enum: [auto, manual] }
                from_image_id: { type: [string, "null"] }
                to_image_id: { type: [string, "null"] }
                error: { type: [string, "null"] }
      responses:
        "204": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/remote/servers/{uuid}/install:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      operationId: reportInstall
      summary: Installatie klaar of mislukt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [successful]
              properties:
                successful: { type: boolean }
                error: { type: [string, "null"] }
      responses:
        "204": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/remote/servers/{uuid}/status:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      operationId: reportStatus
      summary: Statuswijziging (best effort; het panel kan ook GET /api/servers/{uuid} doen)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [installing, install_failed, offline, starting, online, stopping, disk_exceeded, sleeping] }
      responses:
        "204": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/remote/servers/{uuid}/event:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      operationId: reportEvent
      summary: Gebeurtenis die een melding kan opleveren (crash, schijf bijna vol of vol)
      description: |
        Best effort, met retry. `crashed`: de server stopte buiten een stop-opdracht om
        (exitcode != 0, OOM-kill of onverwachte exit). `restart` zegt wat de daemon deed:
        `restarted` (herstart ingepland, `restart_attempt` = poging in het venster van 10 min),
        `gave_up` (limiet bereikt, server blijft offline) of `disabled` (auto-restart staat uit).
        `disk_warning`: 90% van de schijflimiet; `disk_exceeded`: limiet overschreden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [crashed, disk_warning, disk_exceeded] }
                exit_code: { type: [integer, "null"] }
                oom: { type: boolean }
                log_tail:
                  type: array
                  maxItems: 30
                  items: { type: string }
                  description: Laatste consoleregels (max 30).
                crash_report:
                  type: [string, "null"]
                  description: Eerste regels van het nieuwste crash-report (Minecraft `crash-reports/*.txt`), max 4000 tekens.
                restart: { type: string, enum: [restarted, gave_up, disabled] }
                restart_attempt: { type: integer }
                disk_bytes: { type: integer, format: int64 }
                disk_limit_bytes: { type: integer, format: int64 }
      responses:
        "204": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/remote/deploys/{deploy_id}:
    parameters:
      - name: deploy_id
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: reportDeploy
      summary: Resultaat van een git-deploy (POST /api/servers/{uuid}/deploy)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, log_tail]
              properties:
                status: { type: string, enum: [succeeded, failed, cancelled] }
                error: { type: [string, "null"], description: "Korte reden (geheimen geredacteerd)" }
                commit:
                  oneOf:
                    - type: object
                      required: [sha, author, message]
                      properties:
                        sha: { type: string }
                        author: { type: string }
                        message: { type: string }
                        date: { type: [string, "null"], format: date-time }
                    - type: "null"
                log_tail: { type: array, items: { type: string }, description: "Laatste regels van de deploy-log (geredacteerd)" }
                duration_ms: { type: integer, format: int64 }
      responses:
        "204": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/remote/backups/{backup_id}:
    parameters:
      - name: backup_id
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: reportBackup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [successful]
              properties:
                successful: { type: boolean }
                sha256: { type: [string, "null"] }
                size_bytes: { type: [integer, "null"], format: int64 }
                error: { type: [string, "null"], description: "`cancelled` als het panel de backup afbrak (POST .../cancel)" }
      responses:
        "204": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/remote/backups/{backup_id}/restore:
    parameters:
      - name: backup_id
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: reportRestore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [successful]
              properties:
                successful: { type: boolean }
                error: { type: [string, "null"], description: "`cancelled` als het panel het herstel afbrak (de data is dan ongewijzigd)" }
      responses:
        "204": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/remote/sftp/auth:
    post:
      operationId: sftpAuth
      summary: SFTP-login controleren (rate limited per IP en gebruikersnaam)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, ip]
              properties:
                username: { type: string, description: "<discord-naam>.<server-shortid>" }
                password: { type: string, description: "SFTP-wachtwoord of API-sleutel" }
                ip: { type: string }
      responses:
        "200":
          description: Toegestaan
          content:
            application/json:
              schema:
                type: object
                required: [server_uuid, user_id, permissions]
                properties:
                  server_uuid: { type: string, format: uuid }
                  user_id: { type: string }
                  permissions:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Onjuiste gegevens of geen files.read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Te veel pogingen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    nodeToken:
      type: http
      scheme: bearer
  parameters:
    Uuid:
      name: uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Onbekend node-token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Niet gevonden
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    RelayConfig:
      type: object
      required: [edge, clients]
      properties:
        edge:
          oneOf:
            - type: "null"
            - type: object
              required: [node_id, url, fqdn, client_id, secret]
              properties:
                node_id: { type: integer, description: node-id van de edge (A) }
                url: { type: string, description: "https://<fqdn van A>" }
                fqdn: { type: string }
                client_id: { type: integer, description: het eigen node-id }
                secret: { type: string }
        clients:
          type: array
          items:
            type: object
            required: [node_id, fqdn, secret, hosts]
            properties:
              node_id: { type: integer }
              fqdn: { type: string }
              secret: { type: string }
              hosts:
                type: array
                items:
                  type: object
                  required: [host, wildcard, dns_challenge]
                  properties:
                    host: { type: string }
                    wildcard: { type: boolean }
                    dns_challenge:
                      type: [object, "null"]
                      required: [provider, api_token]
                      properties:
                        provider: { type: string, enum: [cloudflare] }
                        api_token: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }

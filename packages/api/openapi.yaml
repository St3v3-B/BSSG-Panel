openapi: 3.1.0
info:
  title: Panel node-daemon API
  version: 1.0.0
  description: |
    API van de Go-daemon op elke node. Eigenaar: orchestrator; de daemon-agent implementeert,
    panel-api roept aan (apps/web/server/daemon/). Wijzigingen alleen via de orchestrator.

    ## Bereikbaarheid
    De daemon luistert op een unix-socket (`DAEMON_SOCKET`, standaard `/run/panel/daemon.sock`)
    en optioneel op `127.0.0.1:$DAEMON_PORT` (standaard 8080). Caddy zet hem op
    `https://$NODE_DOMAIN`. De daemon zelf doet geen TLS.

    ## Authenticatie
    - **nodeToken**: `Authorization: Bearer <NODE_TOKEN>`. Alleen het panel heeft dit token.
      Vergelijking in constante tijd.
    - **browserJwt**: JWT (EdDSA/Ed25519) uitgegeven door het panel. De daemon haalt de publieke
      sleutel op via `GET {PANEL_URL}/api/remote/jwt-key` (zie panel-remote.yaml) en ververst die
      bij een onbekende `kid`. Claims:
      `iss` = PANEL_URL, `aud` = NODE_DOMAIN, `sub` = user-id (string), `server_uuid`,
      `permissions` (array, zie Permission), `jti`, `iat`, `exp` (max 10 min).
      Bij de websocket gaat de JWT in het eerste bericht; bij upload/download in `?token=`.
      Download/upload-JWT's zijn eenmalig (`jti` wordt onthouden tot `exp`). Bij upload staat
      `directory` in de JWT, bij download `path`; wijkt de query-parameter af, dan 403.
      Bij een archief-download (`/files/archive`) staat `archive` (`root`, `paths`, `format`) in de
      JWT en komt de selectie alleen daaruit. Een token met `archive` geldt nergens anders, en
      een token zonder `archive` niet voor `/files/archive` (403).
      Een terminal-JWT heeft `purpose: "terminal"` en `permissions: ["terminal"]`, is eenmalig (`jti`)
      en geldt alleen voor `/terminal`; een JWT zonder `purpose` wordt daar geweigerd.

    ## Fouten
    Altijd `application/json` met het `Error`-schema en een passende statuscode.

    ## Websocket `GET /api/servers/{uuid}/ws`
    Upgrade zonder auth-header. Eerste bericht van de client binnen 10 s:
    `{"event":"auth","token":"<jwt>"}`. Daarna, alle berichten JSON met een `event`-veld:

    | Richting | event | velden | betekenis |
    |---|---|---|---|
    | → daemon | `auth` | `token` | (opnieuw) authenticeren; ook voor token-refresh |
    | → daemon | `send_command` | `command` | regel naar stdin (vereist `console.write`) |
    | → daemon | `set_state` | `state`: start/stop/restart/kill | power (vereist `power`) |
    | → daemon | `request_stats` | | direct een `stats` sturen |
    | ← daemon | `auth_success` | `permissions` | na de eerste geldige `auth` op een verbinding volgen backlog (max 500 regels) als `console_output` en een `status`; een herhaalde `auth` (token-refresh) geeft alleen `auth_success` |
    | ← daemon | `token_expiring` | `expires_at` | 60 s voor `exp` |
    | ← daemon | `token_expired` | | daarna sluit de daemon met code 4001 |
    | ← daemon | `console_output` | `line` | één regel stdout/stderr van de server |
    | ← daemon | `install_output` | `line` | één regel van het install-script |
    | ← daemon | `daemon_message` | `level` (info/warning/error), `line` | meldingen van de daemon zelf (bv. disk 90%) |
    | ← daemon | `status` | `state` (ServerState) | bij elke statuswijziging |
    | ← daemon | `stats` | Stats-velden | elke 2 s zolang de server draait |
    | ← daemon | `backup_progress` | `backup_id`, `operation` (backup/restore), `phase`, `bytes`, `total_bytes`, `percent`, `eta_seconds` (null = onbekend), `cancellable` | elke seconde tijdens backup/herstel (velden als `BackupProgress`); de laatste heeft `phase` `done`, `failed` of `cancelled` |
    | ← daemon | `error` | `message` | bv. recht ontbreekt; verbinding blijft open |

    Sluitcodes: 4001 token verlopen/ongeldig, 4003 geen `console.read`, 4004 server onbekend,
    4008 geen auth binnen 10 s. De schema's staan onder `components.schemas.Ws*`.

    ## Webterminal `GET /api/servers/{uuid}/terminal`
    Interactieve shell in een kortlevende tools-container (`panel.role=shell`, naam
    `panel-<uuid>-shell-<8 hex>`): image `TERMINAL_IMAGE` van de daemon of anders de image van de server,
    `/home/container` = de bestanden van de server, gebruiker 1000:1000, de limieten van de server,
    `cap-drop ALL`, `no-new-privileges`, read-only rootfs met tmpfs `/tmp`, netwerk `panel-site-<uuid>`
    (de database is bereikbaar; geen andere sites, geen docker-socket). De server hoeft niet te draaien.
    Upgrade zonder auth-header (Origin-check als bij `/ws`). Eerste bericht binnen 10 s (tekst):
    `{"event":"auth","token":"<terminal-jwt>","cols":80,"rows":24}`. Daarna:

    | Richting | frame | inhoud | betekenis |
    |---|---|---|---|
    | → daemon | binair | bytes | toetsenbordinvoer naar de pty |
    | → daemon | tekst | `{"event":"resize","cols":n,"rows":n}` | venstergrootte (1–500 × 1–200) |
    | → daemon | tekst | `{"event":"auth","token":…}` | token-refresh (nieuw eenmalig token van dezelfde gebruiker) |
    | ← daemon | tekst | `{"event":"auth_success"}` | shell start; daarna uitvoer |
    | ← daemon | binair | bytes | uitvoer van de pty (UTF-8, ruw) |
    | ← daemon | tekst | `{"event":"token_expiring","expires_at":…}` / `{"event":"token_expired"}` | als bij `/ws` |
    | ← daemon | tekst | `{"event":"terminal_exit","code":n}` | de shell is gestopt; daarna sluit de daemon (1000) |
    | ← daemon | tekst | `{"event":"error","message":…}` | bv. image niet te starten |

    Sluitcodes: 4001 token ongeldig/verlopen/al gebruikt, 4003 geen `terminal`-token, 4004 server onbekend,
    4008 geen auth binnen 10 s, 4009 geen invoer in 15 min (of 4 uur open), 4029 te veel shells
    (3 per server, 20 per node). Bij sluiten verwijdert de daemon de container; verweesde shells
    ruimt hij op bij zijn start.

    ## SSH-shell via de SFTP-poort
    Dezelfde login als SFTP (`<naam>.<shortId>`, SFTP-wachtwoord of API-sleutel). Staat `terminal` in de
    rechten uit `/api/remote/sftp/auth`, dan opent een `shell`-verzoek (met `pty-req`/`window-change`)
    dezelfde tools-container als de webterminal; `exec` en port-forwarding worden geweigerd.
servers:
  - url: https://{nodeDomain}
    variables:
      nodeDomain:
        default: node1.test
security:
  - nodeToken: []
tags:
  - name: system
  - name: servers
  - name: power
  - name: files
  - name: transfer
    description: Directe up/downloads vanuit de browser (JWT in ?token=)
  - name: backups
  - name: databases
    description: Klantdatabases op de MariaDB van deze node (panel-mariadb); het panel beheert ze via de daemon
  - name: routes
    description: Caddy-routes; de daemon is de bron van waarheid en synchroniseert Caddy
  - name: relay
    description: |
      HTTP(S)-relay: een node zonder eigen 80/443 (client, "B") laat al zijn HTTP(S) lopen via een andere node
      (edge, "A"). B opent een uitgaande websocket naar `https://<A>/api/relay/tunnel` met daarover yamux; A's Caddy
      termineert TLS voor de hostnamen die het panel aan B heeft toegewezen (plus B's node-domein) en stuurt ze
      door de tunnel. De configuratie komt van het panel (`GET /api/remote/relay`, panel-remote.yaml).
      Gamepoorten en SFTP gaan nooit via de relay.

paths:
  /api/system:
    get:
      tags: [system]
      operationId: getSystem
      summary: Node-informatie en gezondheid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/update:
    post:
      tags: [system]
      operationId: updateDaemon
      summary: Daemon bijwerken (alleen node-token)
      description: |
        De daemon haalt `<PANEL_URL>/join/daemon/<GOARCH>` en `<...>.sha256`, controleert de sha256, vervangt zijn eigen
        binary (atomair) en stopt daarna zichzelf zodat systemd hem herstart (containers blijven draaien).
        Antwoord 202 direct; 204 als de binary al de huidige is (zelfde sha256). Een browser-JWT is niet voldoende.
      responses:
        "202": { description: Update gedownload en geverifieerd; de daemon herstart zo }
        "204": { description: Al bijgewerkt }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { description: Download of controle mislukt (het oude binary blijft) }

  /api/servers:
    get:
      tags: [servers]
      operationId: listServers
      responses:
        "200":
          description: Alle servers die deze daemon kent
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServerState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [servers]
      operationId: createServer
      summary: Server aanmaken (container + data-map) en installatie starten
      description: |
        Idempotent op `uuid`: bestaat de server al met dezelfde spec, dan 202 zonder nieuwe install;
        met een andere spec 409 `conflict` (gebruik PUT).
        Na de installatie stuurt de daemon `POST /api/remote/servers/{uuid}/install` naar het panel.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerSpec" }
      responses:
        "202":
          description: Aangemaakt, installatie loopt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/servers/{uuid}:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    get:
      tags: [servers]
      operationId: getServer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [servers]
      operationId: updateServer
      summary: Spec bijwerken (limieten, env, image, allocations)
      description: Limieten gaan direct in via docker update; de rest bij de volgende start.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerSpec" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [servers]
      operationId: deleteServer
      summary: Container, netwerk, routes en data verwijderen
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/images/check:
    post:
      tags: [system]
      operationId: checkImages
      summary: Nu op nieuwe images controleren (anders elke IMAGE_CHECK_INTERVAL, standaard 24 uur)
      description: |
        De daemon haalt (`docker pull`) elke image op die door servers van deze node gebruikt wordt
        (runtime- en install-image; alleen de verwezen tags), vergelijkt het nieuwe image-id met dat van
        de draaiende container en meldt het resultaat aan het panel (`POST /api/remote/node/images`).
        Daarna past hij `auto`-beleid toe (zie `image_update` in ServerSpec). Alleen images die de daemon
        zelf ophaalde en die niet meer gebruikt worden, ruimt hij op; nooit zonder panel-labels.
      responses:
        "202": { description: Controle gestart (loopt op de achtergrond) }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/servers/{uuid}/image-update:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      tags: [servers]
      operationId: updateServerImage
      summary: Nu bijwerken - image ophalen en de container opnieuw aanmaken (draaiende server wordt herstart)
      responses:
        "202": { description: "Gestart; het resultaat volgt via POST /api/remote/servers/{uuid}/image-update" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/servers/{uuid}/install:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      tags: [servers]
      operationId: reinstallServer
      summary: Install-script opnieuw draaien (server wordt eerst gestopt; data blijft staan)
      responses:
        "202": { description: Installatie gestart }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/servers/{uuid}/power:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      tags: [power]
      operationId: setPower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { $ref: "#/components/schemas/PowerAction" }
      responses:
        "202": { description: Opdracht aangenomen; status volgt via websocket of GET }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Kan niet in deze staat (bv. installing, of disk_exceeded bij start)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/servers/{uuid}/commands:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      tags: [power]
      operationId: sendCommands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commands]
              properties:
                commands:
                  type: array
                  minItems: 1
                  items: { type: string, maxLength: 2000 }
      responses:
        "204": { description: Naar stdin geschreven }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Server draait niet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/servers/{uuid}/exec:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      tags: [power]
      operationId: execCommand
      description: >-
        Runs one command inside the running container as the container user (uid 1000, never root)
        via `sh -c`, with a timeout and an output cap. Only for websites (`type: web`).
        The command is the user's own, in their own container; it is not validated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: { type: string, minLength: 1, maxLength: 2000 }
                timeout_seconds: { type: integer, minimum: 1, maximum: 600, default: 60 }
      responses:
        "200":
          description: Command finished (also with a non-zero exit code, or after the timeout)
          content:
            application/json:
              schema:
                type: object
                required: [exit_code, output, truncated, timed_out, duration_ms]
                properties:
                  exit_code: { type: integer, description: "-1 on timeout" }
                  output: { type: string, description: "stdout+stderr, the last 16 KiB at most" }
                  truncated: { type: boolean }
                  timed_out: { type: boolean }
                  duration_ms: { type: integer }
        "400":
          description: Invalid command, or the server is not a website
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Server is not running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/servers/{uuid}/logs:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    get:
      tags: [servers]
      operationId: getLogs
      parameters:
        - name: lines
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Laatste regels uit de backlog
          content:
            application/json:
              schema:
                type: object
                required: [lines]
                properties:
                  lines: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/servers/{uuid}/stats:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    get:
      tags: [servers]
      operationId: getStats
      responses:
        "200":
          description: Laatste meting (null-velden als de server niet draait)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/servers/{uuid}/players:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    get:
      tags: [servers]
      operationId: getPlayers
      description: |
        Server-list-ping (Minecraft Java-protocol) naar de primaire allocation van een draaiende
        server, met een timeout van 2 s. Voor de openbare statuspagina; het panel cachet de uitkomst.
        Niet online, geen allocation of geen (geldig) antwoord → 200 met `online: null`.
      responses:
        "200":
          description: Aantal spelers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Players" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/servers/{uuid}/network:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    description: |
      Velocity-netwerk van een proxy. Elke server draait op zijn eigen bridge-netwerk
      `panel-site-<uuid>` en ziet andere servers en de infra niet. De proxy en de hier
      opgegeven backends delen daarnaast `panel-net-<proxy-uuid>` (panel.role=proxy-net,
      panel.server_uuid=<proxy>), waarop de proxy een backend bereikt als `panel-<uuid>:<poort>`.
      Leden die niet draaien worden bij hun start gekoppeld. Een lege lijst (of het verwijderen
      van de proxy) ruimt het netwerk op; een verwijderde backend gaat automatisch uit de lijst.
    get:
      tags: [servers]
      operationId: getProxyNetwork
      responses:
        "200":
          description: Huidige leden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxyNetwork" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [servers]
      operationId: setProxyNetwork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                members:
                  type: array
                  maxItems: 60
                  description: uuids van de backends (game-servers op deze node, niet de proxy zelf)
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Vastgelegd en gekoppeld
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxyNetwork" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/stats:
    get:
      tags: [servers]
      operationId: listStats
      summary: Laatste meting van alle draaiende servers in één keer
      description: |
        Voor de verbruiksgrafieken: het panel vraagt dit elke minuut per node. Alleen servers met een
        draaiende container staan erin. Oudere daemons kennen dit pad niet (404); het panel valt dan
        terug op `GET /api/servers/{uuid}/stats` per draaiende server.
      responses:
        "200":
          description: Metingen per server
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items: { $ref: "#/components/schemas/ServerStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/servers/{uuid}/ws:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    get:
      tags: [servers]
      operationId: websocket
      summary: Console- en stats-websocket (zie protocol bovenaan)
      security: []
      responses:
        "101": { description: Switching Protocols }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/servers/{uuid}/terminal:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    get:
      tags: [servers]
      operationId: terminal
      summary: Webterminal-websocket (zie protocol bovenaan)
      security: []
      responses:
        "101": { description: Switching Protocols }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/servers/{uuid}/files/list:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    get:
      tags: [files]
      operationId: listFiles
      parameters: [{ $ref: "#/components/parameters/Path" }]
      responses:
        "200":
          description: Inhoud van de map
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FileEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/servers/{uuid}/files/contents:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    get:
      tags: [files]
      operationId: readFile
      parameters: [{ $ref: "#/components/parameters/Path" }]
      responses:
        "200":
          description: Ruwe inhoud (max 5 MB; groter → 413)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
    put:
      tags: [files]
      operationId: writeFile
      parameters: [{ $ref: "#/components/parameters/Path" }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Geschreven }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "507": { $ref: "#/components/responses/DiskFull" }

  /api/servers/{uuid}/files/mkdir:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      tags: [files]
      operationId: createDirectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties: { path: { type: string } }
      responses:
        "204": { description: Aangemaakt }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "507": { $ref: "#/components/responses/DiskFull" }

  /api/servers/{uuid}/files/rename:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      tags: [files]
      operationId: renameFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string }
                to: { type: string }
      responses:
        "204": { description: Hernoemd }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/servers/{uuid}/files/delete:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      tags: [files]
      operationId: deleteFiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths: { type: array, minItems: 1, items: { type: string } }
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/servers/{uuid}/files/compress:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      tags: [files]
      operationId: compressFiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root, paths]
              properties:
                root: { type: string }
                paths: { type: array, minItems: 1, items: { type: string } }
      responses:
        "200":
          description: Archief (tar.gz) aangemaakt in root
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "507": { $ref: "#/components/responses/DiskFull" }

  /api/servers/{uuid}/files/decompress:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      tags: [files]
      operationId: decompressFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties: { path: { type: string, description: ".zip, .tar, .tar.gz, .tgz of .tar.zst; pakt uit in dezelfde map" } }
      responses:
        "204": { description: Uitgepakt }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "507": { $ref: "#/components/responses/DiskFull" }

  /api/servers/{uuid}/files/search:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      tags: [files]
      operationId: searchFiles
      summary: Recursief zoeken op bestandsnaam of inhoud
      description: |
        Zoekt onder `path` (standaard `/`). Op naam: hoofdletterongevoelig deel van de naam, of een
        glob met `*`, `?` of `[...]`. Met `content: true` in de inhoud van tekstbestanden tot 1 MB
        (binaire bestanden worden overgeslagen; max 5 regels per bestand, regels ingekort tot 300 tekens).
        Symlinks worden nooit gevolgd (wel op naam gevonden). Stopt na `limit` resultaten
        (`truncated`) of na 10 s (`timed_out`, met de resultaten tot dan).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                path: { type: string, default: "/" }
                query: { type: string, minLength: 1, maxLength: 200 }
                content: { type: boolean, default: false }
                limit: { type: integer, minimum: 0, maximum: 1000, default: 200, description: "0 = standaard (200)" }
      responses:
        "200":
          description: Resultaten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/servers/{uuid}/files/chmod:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      tags: [files]
      operationId: chmodFiles
      summary: Rechten (octaal) zetten, optioneel recursief
      description: |
        `mode` geldt voor bestanden, `dir_mode` (standaard gelijk aan `mode`) voor mappen. Setuid,
        setgid en sticky (het vierde cijfer) alleen met `allow_special: true`, anders 400 `bad_mode`.
        Symlinks worden overgeslagen en nooit gevolgd; de root zelf kan niet (400). Sockets, fifo's
        en devices worden niet aangeraakt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChmodRequest" }
      responses:
        "200":
          description: Gewijzigd
          content:
            application/json:
              schema:
                type: object
                required: [changed]
                properties:
                  changed: { type: integer, description: Aantal bestanden en mappen waarvan de modus is gezet }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/servers/{uuid}/files/upload:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      tags: [transfer]
      operationId: uploadFiles
      security: []
      parameters:
        - { $ref: "#/components/parameters/Token" }
        - name: directory
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "204": { description: Geüpload }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "507": { $ref: "#/components/responses/DiskFull" }

  /api/servers/{uuid}/files/download:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    get:
      tags: [transfer]
      operationId: downloadFile
      security: []
      parameters:
        - { $ref: "#/components/parameters/Token" }
        - { $ref: "#/components/parameters/Path" }
      responses:
        "200":
          description: Bestand (Content-Disposition attachment)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/servers/{uuid}/files/archive:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    get:
      tags: [transfer]
      operationId: downloadArchive
      summary: Map of selectie als zip of tar.gz (gestreamd)
      description: |
        De selectie staat in de `archive`-claim van de eenmalige JWT (`files.read`): `root` (map waartegen
        de namen in het archief relatief zijn), `paths` (1-1000; `/` = alles) en `format` (`zip` of `tar.gz`).
        Het archief wordt tijdens het verzenden gemaakt, zonder tijdelijk bestand op de schijf van de
        server. Symlinks worden nooit gevolgd: in tar.gz blijven ze symlinks, in zip worden ze overgeslagen.
        Fouten in de selectie geven vooraf 400/404; een fout tijdens het streamen breekt de verbinding af.
        Max 4 tegelijk per node, anders 429 `busy`.
      security: []
      parameters:
        - { $ref: "#/components/parameters/Token" }
      responses:
        "200":
          description: Archief (Content-Disposition attachment)
          content:
            application/zip:
              schema: { type: string, format: binary }
            application/gzip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { description: Te veel archief-downloads tegelijk }

  /api/servers/{uuid}/transfer/export:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    get:
      tags: [transfer]
      operationId: exportServerData
      summary: Alle serverdata als tar-stroom (voor verplaatsen naar een andere node)
      description: |
        Streamt de hele datamap als niet-gecomprimeerde tar (paden relatief aan de root, symlinks
        blijven symlinks, speciale bestanden worden overgeslagen). De server moet gestopt zijn
        (`offline`, `sleeping` of `install_failed`), anders 409 `invalid_state`. Alleen met het node-token;
        het panel stuurt de stroom door naar `importServerData` van de doelnode.
      responses:
        "200":
          description: tar-stroom
          content:
            application/x-tar:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/servers/{uuid}/transfer/import:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    put:
      tags: [transfer]
      operationId: importServerData
      summary: Tar-stroom uitpakken in de datamap van een (nieuwe, gestopte) server
      description: |
        Pakt de tar uit in de datamap, met dezelfde veiligheidsregels als decompress (paden buiten
        de map worden overgeslagen, bestaande bestanden vervangen). Server moet gestopt zijn, anders 409.
        Respecteert de schijfquotum (507 `disk_exceeded`). Bij een fout blijft de gedeeltelijke inhoud staan;
        de aanroeper verwijdert dan de hele server.
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Uitgepakt }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "507": { $ref: "#/components/responses/DiskFull" }

  /api/servers/{uuid}/backups:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    post:
      tags: [backups]
      operationId: createBackup
      summary: tar.zst van de data (+ database-dumps) streamen naar S3
      description: Resultaat via `POST /api/remote/backups/{backup_id}` naar het panel.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupRequest" }
      responses:
        "202": { description: Gestart }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/servers/{uuid}/backups/progress:
    parameters: [{ $ref: "#/components/parameters/Uuid" }]
    get:
      tags: [backups]
      operationId: getBackupProgress
      summary: Voortgang van de lopende backup of het lopende herstel van deze server
      description: "`progress` is null als er niets loopt (ook direct na een daemon-herstart: lopend werk overleeft die niet)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [progress]
                properties:
                  progress:
                    oneOf:
                      - $ref: "#/components/schemas/BackupProgress"
                      - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/servers/{uuid}/backups/{backup_id}/cancel:
    parameters:
      - { $ref: "#/components/parameters/Uuid" }
      - name: backup_id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [backups]
      operationId: cancelBackup
      summary: Lopende backup of herstel afbreken
      description: |
        Een backup kan tot het afronden worden afgebroken (het half geüploade object wordt verwijderd); een herstel alleen
        tijdens `stopping` en `downloading`, dus voordat de data wordt omgewisseld: de oude data blijft dan heel en een
        server die draaide start weer. Het resultaat komt zoals altijd via `POST /api/remote/backups/{backup_id}[/restore]`,
        met `successful: false` en `error: "cancelled"`.
      responses:
        "202": { description: Annuleren gestart }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Server onbekend, of `not_running`: deze backup loopt niet", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`not_cancellable`: het herstel wisselt al om of de backup rondt af", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/servers/{uuid}/backups/{backup_id}/restore:
    parameters:
      - { $ref: "#/components/parameters/Uuid" }
      - name: backup_id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [backups]
      operationId: restoreBackup
      summary: Veilig herstel in stappen (zie ontwerp, Backups)
      description: Resultaat via `POST /api/remote/backups/{backup_id}/restore` naar het panel.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreRequest" }
      responses:
        "202": { description: Gestart }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/panel-upgrade/status:
    get:
      tags: [system]
      operationId: getPanelUpgradeStatus
      summary: Versie van de checkout, beschikbare commits en de laatste upgrade (alleen lokale node)
      description: |
        Alleen op de lokale node (`PANEL_REPO_DIR` gezet en `deploy/upgrade.sh` aanwezig); elders 404 `not_local`.
        Doet `git fetch origin` (tenzij `fetch=0`; bij een fout staat die in `fetch_error` en blijft de rest bruikbaar)
        en toont `git log HEAD..origin/main`. `upgrade` en `log_tail` komen uit `$DATA_DIR/upgrade/status.json` en het laatste log.
      parameters:
        - { name: fetch, in: query, required: false, schema: { type: string, enum: ["0", "1"], default: "1" } }
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelUpgradeStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/panel-upgrade:
    post:
      tags: [system]
      operationId: startPanelUpgrade
      summary: deploy/upgrade.sh gedetacheerd starten (systemd-run --unit panel-upgrade-<ts>); alleen lokale node
      description: |
        `ref` is `origin/main` (standaard) of een hex-sha van 7-40 tekens; al het andere is 400 `bad_request`.
        Draait al een upgrade (lock of status `running`), dan 409 `conflict`. Het script herstart daemon en panel zelf;
        de eenheid is los van de daemon, dus een herstart doodt hem niet.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ref: { type: string, description: "origin/main of hex-sha" }
      responses:
        "202":
          description: Gestart
          content:
            application/json:
              schema:
                type: object
                required: [unit, started_at]
                properties:
                  unit: { type: string }
                  started_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/db/status:
    get:
      tags: [databases]
      operationId: getDbStatus
      summary: Is de lokale MariaDB van deze node bereikbaar?
      description: |
        De daemon spreekt de MariaDB van de node via `docker exec` in de container `MARIADB_CONTAINER`
        (standaard `panel-mariadb`) met het rootwachtwoord uit zijn eigen omgeving (`MARIADB_ROOT_PASSWORD`);
        dat wachtwoord verlaat de node nooit. Zonder container of wachtwoord is `available` false.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: { type: boolean }
                  error: { type: string, description: Reden als available false is }
                  host: { type: string, description: "Naam waaronder sites de database bereiken (de containernaam), bv. panel-mariadb" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/db/databases:
    post:
      tags: [databases]
      operationId: createDatabase
      summary: Database + gebruiker aanmaken (gebruiker krijgt alleen rechten op deze database)
      description: |
        Namen moeten `^[a-zA-Z0-9_]{1,64}$` zijn, het wachtwoord 8-128 printbare ASCII-tekens zonder `'` en `\`.
        De gebruiker is `user@'%'` met `ALL PRIVILEGES` op alleen deze database (underscores worden geescaped).
        Bij een fout wordt alles wat al gemaakt was weer verwijderd.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DbCreate" }
      responses:
        "204": { description: Aangemaakt }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /api/db/databases/{name}:
    parameters: [{ $ref: "#/components/parameters/DbName" }]
    delete:
      tags: [databases]
      operationId: dropDatabase
      summary: Database en gebruiker verwijderen (idempotent)
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string, pattern: "^[a-zA-Z0-9_]{1,64}$" }
      responses:
        "204": { description: Verwijderd (of bestond niet) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /api/db/databases/{name}/password:
    parameters: [{ $ref: "#/components/parameters/DbName" }]
    put:
      tags: [databases]
      operationId: setDatabasePassword
      summary: Wachtwoord van de databasegebruiker wijzigen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DbPassword" }
      responses:
        "204": { description: Gewijzigd }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /api/db/databases/{name}/dump:
    parameters: [{ $ref: "#/components/parameters/DbName" }]
    get:
      tags: [databases]
      operationId: dumpDatabase
      summary: SQL-dump van een database als stroom (voor verplaatsen naar een andere node)
      description: |
        Streamt `mariadb-dump --single-transaction --routines --events` (utf8mb4). Mislukt de dump nadat de
        stroom begonnen is, dan wordt de verbinding afgebroken zodat de ontvanger geen afgekapte maar geldige
        dump ziet.
      responses:
        "200":
          description: SQL-stroom
          content:
            application/sql:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /api/db/databases/{name}/import:
    parameters: [{ $ref: "#/components/parameters/DbName" }]
    put:
      tags: [databases]
      operationId: importDatabase
      summary: SQL-dump inladen in een bestaande (lege) database
      description: De database moet eerst met `createDatabase` zijn aangemaakt. Bij een SQL-fout 500 `import_failed` met het eind van de foutmelding.
      requestBody:
        required: true
        content:
          application/sql:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Ingeladen }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          description: Import mislukt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /api/db/pma-users/{username}:
    parameters:
      - name: username
        in: path
        required: true
        schema: { type: string, pattern: "^pma_u[0-9]{1,18}$" }
    put:
      tags: [databases]
      operationId: syncPmaUser
      summary: phpMyAdmin-account van een panelgebruiker bijwerken (wachtwoord + exact deze databases)
      description: |
        Maakt `username@'%'` aan of vervangt het (DROP + CREATE: alle oude rechten vervallen) met het opgegeven
        wachtwoord en `ALL PRIVILEGES` op precies de genoemde databases (underscores geescaped), zonder
        `GRANT OPTION`. Alleen gebruikersnamen `pma_u<getal>` zijn toegestaan en de systeemschema's
        (`mysql`, `information_schema`, `performance_schema`, `sys`) worden geweigerd (400). Een lege lijst geeft
        een account zonder rechten. Databases die (nog) niet bestaan krijgen toch een grant (die is dan leeg).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PmaUserSync" }
      responses:
        "204": { description: Bijgewerkt }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /api/db/tunnel:
    get:
      tags: [databases]
      operationId: dbTunnel
      summary: TCP-tunnel naar de MariaDB van deze node (phpMyAdmin voor databases op remote nodes)
      description: |
        HTTP/1.1-upgrade (`Connection: Upgrade`, `Upgrade: panel-mariadb`) met het node-token. Na
        `101 Switching Protocols` is de verbinding een ruwe, tweerichtings TCP-stroom naar de MariaDB van deze node
        (de container `MARIADB_CONTAINER`, poort 3306, via zijn bridge-adres). Het doel ligt vast: het verzoek kan
        geen host of poort kiezen, en MariaDB hoeft geen poort naar buiten te openen. De aanroeper (het panel) moet
        zich daarna gewoon bij MariaDB aanmelden; de tunnel geeft zelf geen databaserechten.
        Er zijn hoogstens 64 tunnels tegelijk (daarna 503 `too_many_tunnels`); zonder verkeer in beide richtingen
        sluit een tunnel na 15 minuten. Werkt via Caddy (reverse_proxy geeft upgrades door) en via de eigen TLS-poort.
      parameters:
        - { name: Connection, in: header, required: true, schema: { type: string, example: Upgrade } }
        - { name: Upgrade, in: header, required: true, schema: { type: string, enum: [panel-mariadb] } }
      responses:
        "101": { description: Tunnel open; verder ruwe MariaDB-protocolbytes }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426":
          description: Upgrade-header ontbreekt of is niet `panel-mariadb`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DbUnavailable" }

  /api/relay:
    get:
      tags: [relay]
      operationId: getRelay
      summary: Toestand van de relay (als client en als edge)
      parameters:
        - name: ssl
          in: query
          description: "`1` = per hostnaam van de clients ook de SSL-status uit Caddy (traag: TLS-controle per host)"
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayState" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/relay/refresh:
    post:
      tags: [relay]
      operationId: refreshRelay
      summary: Relay-config nu opnieuw bij het panel ophalen
      description: Het panel roept dit aan na een wijziging (relay-keuze, domeinen van een client). Zonder aanroep haalt de daemon de config elke minuut op.
      responses:
        "204": { description: Opgehaald en toegepast }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502":
          description: Panel niet bereikbaar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/relay/tunnel:
    get:
      tags: [relay]
      operationId: relayTunnel
      summary: Websocket-tunnel van een client-node (geen node-token)
      security: []
      description: |
        Alleen voor daemons. Websocket-upgrade met binaire berichten, daarover yamux (A opent de streams, B serveert HTTP).
        Authenticatie met headers: `X-Relay-Node` (node-id van B), `X-Relay-Time` (unix-seconden, max 2 min afwijking),
        `X-Relay-Nonce` (32 hex, eenmalig) en `X-Relay-Signature` =
        `hex(HMAC-SHA256(secret, "panel-relay-v1|client|<A fqdn>|<B id>|<time>|<nonce>"))`.
        A antwoordt in de 101 met `X-Relay-Proof` = `hex(HMAC-SHA256(secret, "panel-relay-v1|edge|<A fqdn>|<B id>|<nonce>"))`;
        B gebruikt de verbinding alleen als dat klopt. Het geheim geeft het panel per paar uit.
      parameters:
        - { name: X-Relay-Node, in: header, required: true, schema: { type: string } }
        - { name: X-Relay-Time, in: header, required: true, schema: { type: string } }
        - { name: X-Relay-Nonce, in: header, required: true, schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
        - { name: X-Relay-Signature, in: header, required: true, schema: { type: string } }
      responses:
        "101": { description: Tunnel open (header X-Relay-Proof) }
        "401":
          description: Handtekening, tijd of nonce ongeldig
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Deze node is niet aan deze edge toegewezen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/routes:
    get:
      tags: [routes]
      operationId: listRoutes
      responses:
        "200":
          description: Alle routes met SSL-status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RouteWithStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/routes/{host}:
    parameters:
      - name: host
        in: path
        required: true
        description: Hostnaam, bv. `blokgenoten.test` of `*.blokgenoten.test` (URL-encoded)
        schema: { type: string }
    put:
      tags: [routes]
      operationId: setRoute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Route" }
      responses:
        "200":
          description: Opgeslagen en naar Caddy gestuurd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteWithStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: server_uuid onbekend op deze node
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [routes]
      operationId: getRoute
      responses:
        "200":
          description: Route met actuele SSL-status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteWithStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [routes]
      operationId: removeRoute
      responses:
        "204": { description: Verwijderd }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    nodeToken:
      type: http
      scheme: bearer
      description: NODE_TOKEN van deze node
  parameters:
    Uuid:
      name: uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    Path:
      name: path
      in: query
      required: true
      description: Pad binnen de serverdata, begint met `/`. `..` buiten de root → 400.
      schema: { type: string }
    DbName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: "^[a-zA-Z0-9_]{1,64}$" }
    Token:
      name: token
      in: query
      required: true
      description: Browser-JWT met files.read (download, archief) of files.write (upload)
      schema: { type: string }
  responses:
    BadRequest:
      description: Ongeldige invoer
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Token ontbreekt of is ongeldig
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Recht ontbreekt in de JWT
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Niet gevonden
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict met huidige staat
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DbUnavailable:
      description: Geen (bereikbare) MariaDB op deze node
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: Te groot
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DiskFull:
      description: Disk-limiet van de server bereikt; schrijven geweigerd
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    DbCreate:
      type: object
      required: [name, username, password]
      properties:
        name: { type: string, pattern: "^[a-zA-Z0-9_]{1,64}$" }
        username: { type: string, pattern: "^[a-zA-Z0-9_]{1,64}$" }
        password: { type: string, minLength: 8, maxLength: 128 }
    DbPassword:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: "^[a-zA-Z0-9_]{1,64}$" }
        password: { type: string, minLength: 8, maxLength: 128 }

    PmaUserSync:
      type: object
      required: [password, databases]
      properties:
        password: { type: string, minLength: 8, maxLength: 128 }
        databases:
          type: array
          maxItems: 5000
          items: { type: string, pattern: "^[a-zA-Z0-9_]{1,64}$" }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Machineleesbare code, bv. `not_found`, `disk_exceeded`, `invalid_state`
        message: { type: string }

    Permission:
      type: string
      enum: [console.read, console.write, files.read, files.write, backup.create, backup.restore, database.manage, domain.manage, schedule.manage, power, terminal]

    PowerAction:
      type: string
      enum: [start, stop, restart, kill]

    ServerState:
      type: object
      required: [uuid, state, disk_bytes, disk_exceeded]
      properties:
        uuid: { type: string, format: uuid }
        state:
          type: string
          enum: [installing, install_failed, offline, starting, online, stopping, disk_exceeded, sleeping]
        disk_bytes: { type: integer, format: int64 }
        disk_exceeded: { type: boolean }
        started_at: { type: [string, "null"], format: date-time }
        installed_at: { type: [string, "null"], format: date-time }

    SystemInfo:
      type: object
      required: [version, disk_quota_mode, cpu_count, memory_total_bytes, memory_used_bytes, disk_total_bytes, disk_free_bytes, docker_version, server_count]
      properties:
        version: { type: string }
        disk_quota_mode: { type: string, enum: [soft, xfs] }
        cpu_count: { type: integer }
        memory_total_bytes: { type: integer, format: int64 }
        memory_used_bytes: { type: integer, format: int64 }
        disk_total_bytes: { type: integer, format: int64 }
        disk_free_bytes: { type: integer, format: int64 }
        docker_version: { type: string }
        server_count: { type: integer }
        caddy_healthy: { type: boolean }
        commit: { type: string, description: "Git-commit waaruit de daemon gebouwd is (leeg bij een ontwikkelbuild)" }

    PanelUpgradeStatus:
      type: object
      required: [current, commits, upgrade, log_tail, daemon_version]
      properties:
        current:
          type: object
          description: HEAD van de checkout
          required: [sha, date, message]
          properties:
            sha: { type: string }
            date: { type: [string, "null"] }
            message: { type: string }
        commits:
          type: array
          description: HEAD..origin/main, nieuwste eerst, max 50
          items:
            type: object
            required: [sha, date, message, author]
            properties:
              sha: { type: string }
              date: { type: [string, "null"] }
              message: { type: string }
              author: { type: [string, "null"] }
        fetch_error: { type: [string, "null"] }
        origin: { type: [string, "null"], description: "URL van git remote origin (voor de GitHub-repo bij CI-status)" }
        upgrade:
          description: Inhoud van status.json (null als er nog nooit een upgrade was)
          type: [object, "null"]
          properties:
            state: { type: string, enum: [idle, running, success, failed, rolled_back] }
            from: { type: string }
            to: { type: string }
            ref: { type: string }
            step: { type: string }
            started: { type: string }
            finished: { type: string }
            error: { type: string }
        log_tail: { type: string, description: "Laatste ~40 regels van het laatste log" }
        daemon_version: { type: string }
        daemon_commit: { type: string }

    Players:
      type: object
      required: [online, max]
      properties:
        online: { type: [integer, "null"], description: "null = geen antwoord op de ping" }
        max: { type: [integer, "null"] }
        version: { type: [string, "null"], description: "versienaam uit het antwoord" }

    ProxyNetwork:
      type: object
      required: [members, network]
      properties:
        members:
          type: array
          items: { type: string, format: uuid }
        network: { type: string, description: "naam van het gedeelde Docker-netwerk; leeg zonder leden" }
    Stats:
      type: object
      required: [cpu_pct, memory_bytes, memory_limit_bytes, network_rx_bytes, network_tx_bytes, disk_bytes, disk_limit_bytes, uptime_ms]
      properties:
        cpu_pct: { type: number, description: "100 = één core vol" }
        memory_bytes: { type: integer, format: int64 }
        memory_limit_bytes: { type: integer, format: int64 }
        network_rx_bytes: { type: integer, format: int64 }
        network_tx_bytes: { type: integer, format: int64 }
        disk_bytes: { type: integer, format: int64 }
        disk_limit_bytes: { type: integer, format: int64 }
        uptime_ms: { type: integer, format: int64, description: "0 als de server niet draait" }

    ServerStats:
      allOf:
        - $ref: "#/components/schemas/Stats"
        - type: object
          required: [uuid]
          properties:
            uuid: { type: string, format: uuid }

    Limits:
      type: object
      required: [cpu_pct, memory_mb, swap_mb, disk_mb]
      properties:
        cpu_pct: { type: integer, minimum: 0, description: "100 = één core, 0 = onbeperkt" }
        memory_mb: { type: integer, minimum: 64 }
        swap_mb: { type: integer, minimum: -1, description: "-1 = onbeperkt, 0 = geen" }
        disk_mb: { type: integer, minimum: 0, description: "0 = onbeperkt" }
        pids: { type: integer, minimum: 32, default: 512 }

    AllocationSpec:
      type: object
      required: [ip, port]
      properties:
        ip: { type: string, description: "IPv4 om op te binden; 0.0.0.0 = alle" }
        port: { type: integer, minimum: 1, maximum: 65535 }
        primary: { type: boolean, default: false, description: "Bepaalt SERVER_IP/SERVER_PORT" }

    ServerSpec:
      type: object
      description: |
        Volledige, al opgeloste spec: het panel zet template + servervariabelen om naar deze vorm.
        `{{VAR}}` in startup en config_files vervangt de daemon met waarden uit `environment`
        plus de ingebouwde variabelen SERVER_UUID, SERVER_MEMORY (= memory_mb), SERVER_IP,
        SERVER_PORT (primaire allocation) en TZ (Europe/Amsterdam).
        De data staat in `/var/lib/panel/volumes/{uuid}` en is in de container `/home/container`.
      required: [uuid, type, image, startup, stop, ready_pattern, environment, limits, allocations, install]
      properties:
        uuid: { type: string, format: uuid }
        type: { type: string, enum: [game, web] }
        image: { type: string }
        startup: { type: string }
        stop:
          type: object
          required: [type, value]
          properties:
            type: { type: string, enum: [command, signal] }
            value: { type: string, description: "commando voor stdin, of SIGTERM/SIGINT/SIGKILL/SIGQUIT" }
        ready_pattern: { type: string, description: "Go-regex (RE2) op stdout" }
        environment:
          type: object
          additionalProperties: { type: string }
        limits: { $ref: "#/components/schemas/Limits" }
        allocations:
          type: array
          description: Leeg voor web
          items: { $ref: "#/components/schemas/AllocationSpec" }
        http_port: { type: [integer, "null"], description: "Alleen web: poort in de container voor Caddy" }
        install:
          type: object
          required: [image, script]
          properties:
            image: { type: string }
            script: { type: string }
        config_files:
          type: array
          items:
            type: object
            required: [path, format, set]
            properties:
              path: { type: string }
              format: { type: string, enum: [properties, yaml, json, toml] }
              set: { type: object, additionalProperties: { type: string } }
        image_update:
          type: [object, "null"]
          description: |
            Beleid voor image-updates van deze server (zie `/api/images/check`). `policy` is
            `default` (globale standaard van het panel, op te halen via
            `GET /api/remote/settings/image-updates`), `auto`, `notify` of `off`. `version_env`:
            naam van een env-variabele in de image-config waarvan major.minor gelijk moet blijven;
            verschilt hij tussen de draaiende en de nieuwe image, dan is `reinstall_required` en past
            de daemon nooit automatisch toe.
          properties:
            policy: { type: string, enum: [default, auto, notify, off], default: default }
            version_env: { type: [string, "null"] }
        start_on_install: { type: boolean, default: false }
        server_icon:
          type: string
          enum: [none, bssg]
          default: none
          description: |
            `bssg`: na een geslaagde (her)installatie schrijft de daemon het BSSG-logo (64x64) als
            `server-icon.png` in de servermap, alleen als dat bestand er nog niet is, en vóór de start
            van `start_on_install`.
        sleep:
          type: [object, "null"]
          description: |
            Slaapstand (alleen game, Minecraft Java). De daemon telt elke minuut de spelers via een
            status-ping op de primaire allocation. Na idle_minutes zonder spelers stopt hij de server
            (status `sleeping`) en luistert hij zelf op die ip:poort: een status-ping krijgt `motd`,
            een login-poging start de server en krijgt een disconnect met `kick_message`. Een
            handmatige stop zet de server op `offline` (niet slapen); een handmatige start of een
            verbindingspoging maakt hem wakker.
          required: [idle_minutes]
          properties:
            idle_minutes: { type: integer, minimum: 1, maximum: 1440 }
            motd: { type: string, default: "Server is sleeping - join to start it" }
            kick_message: { type: string, default: "The server is starting, please reconnect in a minute." }
            server_name: { type: string, maxLength: 100, description: "Naam voor de eerste MOTD-regel (zonder: alleen `motd`)." }
            promo:
              type: string
              maxLength: 120
              description: |
                Tweede MOTD-regel, met `&`-kleurcodes (`&a`, `&l`, `&r`, `&#rrggbb`). Leeg = standaardregel.
                Met `server_name` bouwt de daemon een tweeregelige JSON-tekstcomponent voor `description`
                (en `kick_message` in dezelfde stijl), een `players.sample` met een hint, en een `favicon`.
            favicon_mode:
              type: string
              enum: [server_or_logo, server_only]
              default: server_or_logo
              description: |
                Icoon in de serverlijst: het eigen `server-icon.png` (64x64 PNG, max 64 kB) uit de servermap,
                anders het BSSG-logo (`server_or_logo`) of geen icoon (`server_only`).
        auto_restart:
          type: [object, "null"]
          description: |
            Automatisch herstarten na een crash (null = uit). Een crash is een exit buiten een
            stop-opdracht om (exitcode != 0, OOM-kill, of een exit terwijl de server online hoort
            te zijn). De daemon herstart met backoff (5 s, 15 s, 45 s, ...) en geeft op na
            `max_per_10min` herstarts binnen 10 minuten: de server blijft dan `offline`. Elke crash
            wordt gemeld via `POST /api/remote/servers/{uuid}/event` (panel-remote.yaml).
          required: [max_per_10min]
          properties:
            max_per_10min: { type: integer, minimum: 1, maximum: 20 }
        skip_install: { type: boolean, default: false, description: "Alleen bij POST: niet installeren. PUT installeert nooit; herinstallatie gaat via POST /install." }

    FileEntry:
      type: object
      required: [name, path, is_directory, is_symlink, size, mode, mime_type, modified_at]
      properties:
        name: { type: string }
        path: { type: string }
        is_directory: { type: boolean }
        is_symlink: { type: boolean }
        size: { type: integer, format: int64 }
        mode: { type: string, example: "-rw-r--r--" }
        mime_type: { type: string }
        modified_at: { type: string, format: date-time }

    SearchResult:
      type: object
      required: [results, truncated, timed_out]
      properties:
        results:
          type: array
          items:
            type: object
            required: [entry, matches]
            properties:
              entry: { $ref: "#/components/schemas/FileEntry" }
              matches:
                type: array
                description: Alleen bij zoeken op inhoud (anders leeg)
                items:
                  type: object
                  required: [line, text]
                  properties:
                    line: { type: integer, description: Regelnummer (vanaf 1) }
                    text: { type: string }
        truncated: { type: boolean, description: Er zijn meer resultaten dan `limit` }
        timed_out: { type: boolean, description: Na 10 s gestopt; de resultaten zijn onvolledig }

    ChmodRequest:
      type: object
      required: [paths, mode]
      properties:
        paths: { type: array, minItems: 1, maxItems: 1000, items: { type: string } }
        mode: { type: string, pattern: "^[0-7]{3,4}$", example: "644" }
        dir_mode: { type: string, pattern: "^[0-7]{3,4}$", example: "755" }
        recursive: { type: boolean, default: false }
        allow_special: { type: boolean, default: false, description: Setuid/setgid/sticky toestaan }

    S3Credentials:
      type: object
      description: Alleen voor de duur van het verzoek; de daemon bewaart ze niet
      required: [endpoint, bucket, region, access_key, secret_key, path_style]
      properties:
        endpoint: { type: string }
        bucket: { type: string }
        region: { type: string }
        access_key: { type: string }
        secret_key: { type: string }
        path_style: { type: boolean }

    DatabaseCredentials:
      type: object
      required: [name, host, port, username, password]
      properties:
        name: { type: string }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }

    BackupRequest:
      type: object
      required: [backup_id, s3, key, databases]
      properties:
        backup_id: { type: integer }
        s3: { $ref: "#/components/schemas/S3Credentials" }
        key: { type: string, description: "S3-objectnaam, bv. servers/{uuid}/{backup_id}.tar.zst" }
        ignore:
          type: array
          items: { type: string }
          description: glob-patronen relatief aan de root
        databases:
          type: array
          description: Dumps komen in het archief onder `_databases/{name}.sql`
          items: { $ref: "#/components/schemas/DatabaseCredentials" }

    BackupProgress:
      type: object
      required: [backup_id, operation, phase, bytes, total_bytes, percent, eta_seconds, started_at, cancellable]
      properties:
        backup_id: { type: integer }
        operation: { type: string, enum: [backup, restore] }
        phase:
          type: string
          enum: [preparing, dumping, archiving, stopping, downloading, applying, finishing, done, failed, cancelled]
          description: |
            backup: preparing (meten) → dumping (alleen met databases) → archiving (streamen naar S3) → finishing.
            herstel: stopping → downloading (downloaden + checksum + uitpakken) → applying (omwisselen + databases) → finishing.
            `done`/`failed`/`cancelled` alleen in het laatste websocket-bericht.
        bytes: { type: integer, format: int64, description: "verwerkt in deze fase: gelezen brondata (backup) of gedownloade bytes (herstel)" }
        total_bytes: { type: integer, format: int64, description: "0 = onbekend" }
        percent: { type: integer, minimum: 0, maximum: 100 }
        eta_seconds: { type: [integer, "null"], format: int64, description: "geschatte resterende tijd van de fase; null = onbekend" }
        started_at: { type: string, format: date-time }
        cancellable: { type: boolean }

    RestoreRequest:
      type: object
      required: [s3, key, sha256, databases]
      properties:
        s3: { $ref: "#/components/schemas/S3Credentials" }
        key: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        databases:
          type: array
          items: { $ref: "#/components/schemas/DatabaseCredentials" }

    Route:
      type: object
      required: [host, server_uuid]
      properties:
        host: { type: string }
        server_uuid: { type: string, format: uuid }
        port: { type: [integer, "null"], description: "poort in de container; null = http_port uit de spec (web). Voor game-servers verplicht: de daemon koppelt de container dan aan panel-site-<uuid> (aangemaakt indien nodig) zodat Caddy erbij kan." }
        redirect_to: { type: [string, "null"], description: "Als gezet: 308 naar https://{redirect_to}{path}" }
        wildcard: { type: boolean, default: false, description: "true alleen samen met host = *.domein; de daemon leidt het ook af uit de host" }
        dns_challenge:
          type: [object, "null"]
          description: Nodig voor wildcard-certificaten
          required: [provider, api_token]
          properties:
            provider: { type: string, enum: [cloudflare] }
            api_token: { type: string }

    RouteWithStatus:
      allOf:
        - $ref: "#/components/schemas/Route"
        - type: object
          required: [ssl_status]
          properties:
            ssl_status: { type: string, enum: [pending, dns_wrong, issuing, active, failed] }
            ssl_error: { type: [string, "null"] }
            checked_at: { type: [string, "null"], format: date-time }

    RelayTunnelStatus:
      type: object
      description: De tunnel vanaf de client (B) gezien
      required: [edge_node_id, edge_url, connected, reconnects]
      properties:
        edge_node_id: { type: integer }
        edge_url: { type: string }
        connected: { type: boolean }
        connected_at: { type: [string, "null"], format: date-time }
        latency_ms: { type: [number, "null"] }
        last_error: { type: [string, "null"] }
        last_error_at: { type: [string, "null"], format: date-time }
        reconnects: { type: integer }

    RelayClientState:
      type: object
      description: Eén client vanaf de edge (A) gezien
      required: [node_id, fqdn, connected, hosts]
      properties:
        node_id: { type: integer }
        fqdn: { type: string }
        connected: { type: boolean }
        connected_at: { type: [string, "null"], format: date-time }
        latency_ms: { type: [number, "null"] }
        remote: { type: string }
        last_error: { type: [string, "null"] }
        last_error_at: { type: [string, "null"], format: date-time }
        hosts: { type: array, items: { type: string }, description: "fqdn van B plus de toegewezen hostnamen" }
        ssl:
          type: array
          description: Alleen met `?ssl=1`
          items:
            type: object
            required: [host, ssl_status]
            properties:
              host: { type: string }
              ssl_status: { type: string, enum: [pending, dns_wrong, issuing, active, failed] }
              ssl_error: { type: [string, "null"] }

    RelayState:
      type: object
      required: [http_mode, edge, clients]
      properties:
        http_mode: { type: string, enum: [direct, relay], description: "HTTP_MODE van de node (relay = Caddy zonder publieke poorten)" }
        edge:
          description: Gezet als deze node via een andere node loopt
          oneOf:
            - $ref: "#/components/schemas/RelayTunnelStatus"
            - type: "null"
        clients:
          type: array
          items: { $ref: "#/components/schemas/RelayClientState" }

    # ---------- websocket-berichten ----------
    WsAuth:
      type: object
      required: [event, token]
      properties:
        event: { const: auth }
        token: { type: string }
    WsSendCommand:
      type: object
      required: [event, command]
      properties:
        event: { const: send_command }
        command: { type: string }
    WsSetState:
      type: object
      required: [event, state]
      properties:
        event: { const: set_state }
        state: { $ref: "#/components/schemas/PowerAction" }
    WsRequestStats:
      type: object
      required: [event]
      properties:
        event: { const: request_stats }
    WsClientMessage:
      oneOf:
        - $ref: "#/components/schemas/WsAuth"
        - $ref: "#/components/schemas/WsSendCommand"
        - $ref: "#/components/schemas/WsSetState"
        - $ref: "#/components/schemas/WsRequestStats"
    WsServerMessage:
      type: object
      required: [event]
      description: Velden afhankelijk van event, zie de tabel bovenaan
      properties:
        event:
          type: string
          enum: [auth_success, token_expiring, token_expired, console_output, install_output, daemon_message, status, stats, backup_progress, error]
        permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }
        expires_at: { type: string, format: date-time }
        line: { type: string }
        level: { type: string, enum: [info, warning, error] }
        state: { type: string }
        message: { type: string }
        backup_id: { type: integer }
        operation: { type: string, enum: [backup, restore] }
        phase: { type: string }
        bytes: { type: integer, format: int64 }
        total_bytes: { type: integer, format: int64 }
        percent: { type: number }
        eta_seconds: { type: [integer, "null"], format: int64 }
        cancellable: { type: boolean }
        cpu_pct: { type: number }
        memory_bytes: { type: integer, format: int64 }
        memory_limit_bytes: { type: integer, format: int64 }
        network_rx_bytes: { type: integer, format: int64 }
        network_tx_bytes: { type: integer, format: int64 }
        disk_bytes: { type: integer, format: int64 }
        disk_limit_bytes: { type: integer, format: int64 }
        uptime_ms: { type: integer, format: int64 }
